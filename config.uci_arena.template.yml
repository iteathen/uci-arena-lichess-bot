{
  "schema": "uci_arena_lichess_adapter_v1",
  "url": "https://lichess.org/",
  "engine": {
    "executable": "<UCI_ARENA_REPO>/build/Release/flashfork_uci.exe",
    "working_directory": "<UCI_ARENA_REPO>",
    "search_timeout_grace_ms": 10000,
    "uci_options": {
      "Threads": 4,
      "BackgroundSearch": true,
      "BehaviorProfile": "balanced",
      "ModelBackend": "flashfork",
      "ModelRoot": "engine/runtime/models/resnet_fp16/engine"
    }
  },
  "challenges": {
    "concurrency": 1,
    "accept_bots": true,
    "min_base": 180,
    "max_base": 1800,
    "min_increment": 0,
    "max_increment": 10,
    "speeds": ["rapid", "classical"],
    "modes": ["casual"]
  },
  "outbound_challenge": {
    "rated": false,
    "color": "random",
    "clock_limit": 180,
    "clock_increment": 2
  }
}
