{
  "schema": "uci_arena_lichess_adapter_v7",
  "url": "https://lichess.org/",
  "engine": {
    "adapter": "uci_arena_extended_v1",
    "executable": "<UCI_ARENA_ENGINE_ROOT>/bin/uci_arena_engine.exe",
    "arguments": [],
    "working_directory": "<UCI_ARENA_ENGINE_ROOT>",
    "single_game_profile": "<UCI_ARENA_ENGINE_ROOT>/profiles/uci_arena_single_game_profile_v1.json",
    "time_profile": "<UCI_ARENA_ENGINE_ROOT>/profiles/uci_time_profile_v3.json",
    "temporal_curve_profile": null,
    "fallback_bundle": null,
    "search_timeout_grace_ms": 10000,
    "shutdown_grace_ms": 5000,
    "uci_options": {
      "BehaviorProfile": "balanced",
      "ModelBackend": "onnx",
      "ModelRoot": "models/latticeknight",
      "McgsTimePolicy": "RelativeClockTemporalV1",
      "McgsTemporalWeightProfile": "EarlyCurrent",
      "OwnBook": true
    }
  },
  "qualification": {
    "complete_game_entrypoint": "<UCI_ARENA_EVIDENCE_RUNTIME_ROOT>/arena/run_complete_game_matrix.mjs",
    "referee": "<UCI_ARENA_EVIDENCE_RUNTIME_ROOT>/bin/uci_arena_complete_game_referee.exe",
    "stockfish": "<STOCKFISH_ROOT>/bin/stockfish.exe"
  },
  "timing": {
    "opponent_turn_search": true,
    "foreground_preempts_ponder": true,
    "initial_transport_reserve_ms": 650,
    "transport_profile_path": null
  },
  "capacity": {
    "total_slots": 2,
    "capacity_profile": "<UCI_ARENA_ENGINE_ROOT>/profiles/uci_arena_lichess_capacity_profile_v2.json",
    "startup_parallelism": 2,
    "human": {
      "slots": 1,
      "allow_borrowing": false,
      "accept_public": true
    },
    "bot": {
      "slots": 1,
      "target_active": 1
    }
  },
  "challenges": {
    "accept_bots": true,
    "min_base": 600,
    "max_base": 1800,
    "min_increment": 0,
    "max_increment": 10,
    "speeds": ["rapid", "classical"],
    "modes": ["casual"]
  },
  "outbound_challenge": {
    "rated": false,
    "color": "random",
    "clock_limit": 600,
    "clock_increment": 2
  },
  "scheduler": {
    "enabled": true,
    "discovery_interval_seconds": 60,
    "challenge_interval_seconds": 5,
    "reservation_retry_seconds": 30,
    "challenge_timeout_seconds": 25,
    "first_move_timeout_seconds": 60,
    "max_games_per_opponent_per_day": 1,
    "timeout_cooldown_minutes": 30,
    "decline_cooldown_minutes": 360,
    "rating_target": 2200,
    "rating_spread": 600
  }
}
