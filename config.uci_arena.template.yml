{
  "schema": "uci_arena_lichess_adapter_v4",
  "url": "https://lichess.org/",
  "engine": {
    "executable": "<UCI_ARENA_REPO>/build/Release/flashfork_uci.exe",
    "working_directory": "<UCI_ARENA_REPO>",
    "single_game_profile": "<UCI_ARENA_REPO>/runtime_state/models/compact_chessformer_gab_v1/cache/uci_arena_single_game_profile_v1.json",
    "time_profile": "<UCI_ARENA_REPO>/runtime_state/models/compact_chessformer_gab_v1/cache/uci_time_profile_v1.json",
    "search_timeout_grace_ms": 10000,
    "shutdown_grace_ms": 5000,
    "uci_options": {
      "BehaviorProfile": "balanced",
      "ModelBackend": "flashfork",
      "ModelRoot": "engine/runtime/models/compact_chessformer_gab_v1/engine"
    }
  },
  "timing": {
    "opponent_turn_search": true,
    "foreground_preempts_ponder": true,
    "initial_transport_reserve_ms": 250
  },
  "capacity": {
    "total_slots": 2,
    "capacity_profile": "<UCI_ARENA_REPO>/runtime_state/models/compact_chessformer_gab_v1/cache/uci_arena_lichess_capacity_profile_v1.json",
    "startup_parallelism": 2,
    "human": {
      "slots": 1,
      "allow_borrowing": false,
      "accept_public": true
    },
    "bot": {
      "slots": 1,
      "target_active": 1
    }
  },
  "challenges": {
    "accept_bots": true,
    "min_base": 180,
    "max_base": 1800,
    "min_increment": 0,
    "max_increment": 10,
    "speeds": ["blitz", "rapid", "classical"],
    "modes": ["casual"]
  },
  "outbound_challenge": {
    "rated": false,
    "color": "random",
    "clock_limit": 180,
    "clock_increment": 2
  },
  "scheduler": {
    "enabled": true,
    "discovery_interval_seconds": 60,
    "challenge_interval_seconds": 5,
    "reservation_retry_seconds": 30,
    "challenge_timeout_seconds": 25,
    "max_games_per_opponent_per_day": 2,
    "timeout_cooldown_minutes": 30,
    "decline_cooldown_minutes": 360,
    "rating_target": 2200,
    "rating_spread": 600
  }
}
