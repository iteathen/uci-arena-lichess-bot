outbound_timeout_reconciliation_2026_07_20:
  status: active
  state_machine:
    - "A timed-out outbound slot enters cancelling and sends at most one concurrent cancel request."
    - "HTTP 200 records timeout and releases the exact slot generation. HTTP 404 means the challenge is absent: reconcile api/account/playing, recover a matching active game, or hold a two-second late-event grace before generation-safe release."
    - "HTTP 429 retains the slot and waits at least 60 seconds. Network and 5xx failures retry after 15, 30, 60, 120, and 300 seconds; exhaustion pauses outbound scheduling and retains the slot."
    - "Authentication failures are fatal. Other permanent 4xx responses pause outbound scheduling after reconciliation and never enter a fixed-interval retry loop."
    - "Late gameStart recovery, timeout reconciliation, and event-driven release are idempotent and generation-safe. A released child may not be reused until its grace expires."
  terminal_drain:
    - "Exact UCI bestmove 0000 is accepted only while draining cancelled or authoritative-terminal work. It is telemetry-only and never a playable candidate."
    - "Foreground, ponderhit, and nonterminal search results remain strict: missing, malformed, null, stale, or illegal bestmoves fail closed."
  validation:
    - "Mocks cover cancel 200, 404 absent, 404 accepted-game recovery, late gameStart, 429, bounded 5xx/network exhaustion, authentication failure, and concurrent release with no duplicate cancel or engine leak."
    - "Terminal ponder and opponent-root drains may return 0000 without reopening the global event stream; foreground 0000 remains an error."

outbound_rate_limit_circuit_breaker_2026_07_20:
  status: superseded_by_api_rate_limit_safety_2026_07_21

api_rate_limit_safety_2026_07_21:
  status: active
  source_authority:
    api_revision: 3033570771c5583c9cfc077ba68231b9b5172182
    rules:
      - "Only initiate one finite API exchange or stream handshake at a time."
      - "After any HTTP 429, initiate no Lichess API request for at least one full minute; there is no move exception."
      - "Rate-limit thresholds are unpublished and may change, so local request-per-second assumptions are not authority."
  request_ownership:
    - "One API safety coordinator is shared by authenticated identity probing, finite requests, global-stream handshakes, and per-game-stream handshakes."
    - "Finite exchanges retain the coordinator permit through response-body completion. Established long-lived streams release the handshake permit and remain open during cooldown."
    - "Exactly one global event stream and at most one game stream per game may be pending or established."
    - "Priority order is move, game-stream reconnect, global-event reconnect, reconciliation/challenge control, challenge creation, then discovery. Priority never bypasses cooldown."
    - "Delayed move and challenge writes revalidate their authoritative generation and useful lifetime immediately before dispatch."
    - "A permanent API error may retain only a bounded sanitized Lichess
      response error/message string for operator diagnosis. Response headers,
      request headers, Authorization, token contents, and arbitrary response
      documents must never enter the exception or logs."
  cooldown:
    minimum_ms: 60000
    consecutive_schedule_ms: [60000, 120000, 300000, 900000, 3600000]
    strike_reset_after_ms: 21600000
    rules:
      - "The effective delay is the maximum of the consecutive schedule and a valid Retry-After delta or HTTP-date value."
      - "Cooldown and strike state are persisted synchronously before the 429 is propagated and survive adapter restart."
      - "All new moves, finite requests, and stream reconnect handshakes wait. Existing streams remain open for authoritative observations."
      - "Move, challenge-create, accept, decline, and cancel writes are never blindly replayed; their owning state machine reconciles before issuing another write."
      - "Automatic recovery is allowed only after the effective cooldown. No configuration or local command may shorten it."
  single_client_lease:
    key: api_origin_plus_expected_account
    heartbeat_ms: 10000
    expiry_ms: 60000
    rules:
      - "Run and authenticated probe modes acquire the SQLite lease before reading credentials or contacting Lichess."
      - "A second live adapter for the same authority fails locally before an API request. An expired lease may be reclaimed transactionally."
  validation:
    - "Fake-clock tests prove every request class remains blocked for the full effective cooldown and consecutive delays escalate and reset exactly."
    - "Concurrency tests prove one finite exchange or handshake at a time while established event and game streams coexist."
    - "Restart and migration tests prove schema-v2 cooldown durability, lease exclusion, heartbeat, expiry, and owner-safe release."
    - "No live validation deliberately induces a Lichess 429."

mixed_mcgs_capacity_canary_2026_07_20:
  status: active
  profile_schema: uci_arena_lichess_capacity_profile_v2
  rules:
    - "A two-slot profile binds exact single-game and timing-profile hashes and qualifies one timed foreground child beside one opponent-root child, then swaps roles."
    - "Each independently selectable engine-adapter configuration carries its own capacity evidence. Changing adapter, executable, model, timing, or options requires a newly validated composition before token contents are read; there is no hidden runtime fallback bundle."
    - "Both children remain GPU-backed and satisfy deadline, stop/drain, handoff, stale-publication, and reservation-integrity gates in every evidence round."
    - "The initial live canary is one casual public-human slot plus one casual bot slot at rapid/classical controls with outbound 600+2 and at most one game per opponent per day."

persistent_mcgs_worker_scaling_2026_07_21:
  status: active
  benchmark_schema: uci_arena_mcgs_worker_scaling_v1
  implementation_contract: uci_arena.evidence.runtime/mcgs_worker_scaling_v1
  worker_authority:
    controlling_option: Threads
    compatibility_only_option: RootWorkers
    rule: >
      Persistent MCGS creates one simulation worker per effective Threads
      value. RootWorkers remains part of the shared UCI/profile surface but
      does not control MCGS simulation parallelism and must not be varied or
      described as the MCGS worker count.
  required_matrix:
    worker_counts: [3, 4, 6, 8, 10]
    temperatures: [cold_graph, warm_graph]
    movetime_ms: [250, 500, 1000]
    minimum_independent_trials: 3
    minimum_position_classes: 5
  fixed_identity:
    - engine executable content hash
    - exact model root and checkpoint hash
    - model and adapter fingerprints
    - effective GPU provider, numeric contract, runtime, and hardware/driver fingerprint
    - graph size, Cpuct, outstanding-batch count, batch size, and batch wait
    - exact live Syzygy path, manifest identity, loaded cardinality, probe-worker topology, rule-50 policy, and root/internal probe activation when tablebases are configured
    - background search false and opening book false during measurement
  required_measurements:
    - command elapsed and deadline overshoot
    - completed simulations and completed simulations per second
    - graph nodes and edges
    - asynchronous admissions, capacity deferrals, and outstanding peak
    - provider batches, rows, service time, and rows per batch
    - root legal-move coverage and bestmove
    - provider-admission denials and post-admission cache/proof continuation
    - stale backups and reservation leaks
  execution_rules:
    - "Each worker-count trial uses a fresh UCI process; cold and immediate same-root warm samples remain paired inside that process."
    - "Matrix order rotates by trial so thermal or cache drift cannot always favor one worker count."
    - "Every sample must remain MCGS, use the exact requested worker count, retain the exact model/provider identity, return a legal non-null move, and finish with zero stale backups and reservation leaks."
    - "Throughput, provider utilization, graph growth, and deadline behavior are analyzed together; depth is not a sufficient proxy for MCGS work or playing value."
    - "The benchmark reports evidence and Pareto relationships. It does not switch search core, edit live configuration, publish a deployment profile, or infer strength from worker count alone."
    - "Book Forge is paused or must recognize uci_arena_engine.exe as the priority engine process during measured runs, then returns to continuous operation."
  selected_live_topology_2026_07_22:
    status: exact_model_single_game_and_two_child_capacity_qualified
    threads: 3
    root_workers: 1
    rationale: >
      The four-worker candidate improved several warm throughput samples but
      scored 7/16 against the three-worker control in 16 equal-wall-time,
      paired-color games. Six and ten workers were throughput-dominated; eight
      was mixed and then adverse against four. Three workers is the current
      measured operating point, not a permanent default or a claim that useful
      MCGS parallelism ends at three.
    evidence:
      scaling_artifact_sha256: "sha256:22a3af9e0e18e51f68e4a4f4c29dfbcb2e6c5d1fd796534ef905224067bea429"
      paired_4_vs_3_artifact_sha256: "sha256:d7715c900ab112782af5b5086f29df9406f3fa0393a24b1e72bda44957ff4eb1"
      timing_profile_identity_sha256: "sha256:8be9bdb06c5f9ae5bd9bab5a4ab376aaecfa4893c6b9d6c5f4ab0324b474c6fd"
    invalidation: >
      Requalify the full worker matrix after a material executable, model,
      adapter, provider/runtime, batch contract, graph policy, or hardware and
      driver identity change. Missing evidence fails startup and never selects
      V2.

protected_live_acceptance_2026_07_26:
  status: active
  authority: live-acceptance.mjs
  purpose: >
    Prove the installed adapter can complete one real casual standard game
    without turning an ordinary test run into an authenticated Lichess action.
  activation:
    - "Require the exact explicit one-game confirmation phrase."
    - "Require separate expected operator-account and target-opponent names."
    - "Accept the credential only as a token-file path passed to the adapter process."
    - "Never enable this acceptance from unit tests, package build, or default startup."
    - "Use the existing operator BOT account; do not require or provision a second account."
    - "The acceptance harness consumes the current v7 provider configuration and runs from the provider component root independent of the caller's working directory."
  participant_gate:
    - "The authenticated identity must exactly match the expected operator account and have title BOT."
    - "The target must be distinct, public, online, and have title BOT."
    - "An already active game is recoverable only when its opponent is the named target; unrelated active games fail closed."
  execution:
    game: casual_standard
    maximum_challenge_attempts: 3
    wall_clock_limit_minutes: 20
    scheduler: disabled_except_explicit_named_target
    shutdown: >
      The harness sends a literal shutdown command over the adapter child's
      private stdin and waits for graceful lease/store cleanup before using
      forced termination as a bounded fallback.
    success: "Observe the authoritative game stream reach a terminal state for a game against the named target."
    inconclusive: >
      Decline, timeout, API ambiguity, adapter exit, participant mismatch,
      attempt exhaustion, or wall-clock expiry is non-success. Runtime state is
      retained so a rerun can recover an in-progress target game.
  validation:
    - "Mock API tests cover correct identities, wrong/non-BOT/offline targets, and unrelated active games."
    - "Mock process/event tests prove the confirmation gate, attempt cap, wall-clock cap, target-only completion requirement, and fail-closed rerun result."
    - "Tests never read a token file or contact Lichess."

manager_account_and_options_contract_2026_07_31:
  status: active
  owner: lichess_node_adapter_with_manager_typed_projection
  purpose: >
    Make ordinary Lichess bot account controls and policy configuration
    available to UCI Arena Manager without giving the browser arbitrary file,
    command, credential, or adapter-process authority.
  credential_boundary:
    - "The bot token remains operator-owned outside every repository and installed component. Configuration reads and writes never accept, return, inspect, persist, or log token contents."
    - "Repository policy excludes local token/config patterns and provider-owned runtime, game, and log directories from version control; the boundary check fails if those protections are removed."
    - "Manager may pass an external token-file path only to the existing authenticated probe, startup, or run operation. A token path is not part of editable bot configuration."
    - "Authenticated identity is discovered through the provider-owned account probe. Manager must not infer account identity from filenames, config text, or local owner records."
  provider_owned_projection:
    schema: uci_arena_lichess_manager_options_v1
    groups:
      - capacity
      - inbound_challenges
      - outbound_challenge
      - scheduler
      - opponent_selection
    rules:
      - "The published JSON Schema must describe the exact top-level projection returned by config get. The schema, provider output, and Manager operation response identifier must not introduce a wrapper that the other two do not use."
      - "The config update request has its own closed schema. Every editable group and nested field is typed and bounded; response and request contracts must not be conflated."
      - "Configuration and status objects reject undeclared nested fields. Capacity evidence, slot state, scheduler faults, rate-limit state, nullable counters, and bounded identifiers are explicit contract fields rather than untyped objects. Capacity evidence distinguishes legacy one-slot authority, a standard-UCI one-slot startup probe, standard-UCI evidence requiring runtime revalidation, missing evidence, qualified evidence, and rejected evidence."
      - "The Node adapter is the sole schema, validation, migration, and atomic-write owner for these groups. Manager invokes the declared adapter operation and renders the bounded result."
      - "Reading the bounded projection and updating non-capacity policy groups remain available while engine, timing, single-game, temporal-curve, or capacity qualification is incomplete. These configuration operations validate the provider document and editable policy schema without claiming live readiness."
      - "Editable operations use a strict allowlist. Engine paths, model/profile paths, URL, runtime directory, store path, startup definition, arbitrary UCI options, and unknown fields are not writable through the Manager projection."
      - "Configuration updates require an explicit local config path and preserve unedited provider-owned fields and portable path placeholders."
      - "A proposed update is fully validated before atomic replacement; failure leaves the prior file byte-for-byte authoritative."
      - "Capacity changes cannot exceed a present qualified capacity profile. The adapter validates the complete profile, exact engine and single-game identity bindings, timing-profile file and identity bindings, and concurrent evidence before accepting the change; a schema/qualified/max-concurrency summary alone has no authority."
      - "An update that leaves the qualified capacity shape unchanged does not reclassify unrelated onboarding blockers as configuration-write failures; changing the capacity shape always re-runs the complete capacity-evidence gate."
      - "Missing, malformed, unqualified, identity-mismatched, or undersized capacity evidence rejects a capacity change."
      - "Adding rated games to either the inbound challenge modes or the outbound challenge policy requires the rated-play confirmation; enabling automatic outbound challenges requires its distinct confirmation value. A generic save action is insufficient."
  account_controls:
    operations:
      - owner_list
      - owner_add
      - owner_remove
      - reservation_status
      - reservation_create
      - reservation_cancel
      - scheduler_status
      - scheduler_pause
      - scheduler_resume
      - startup_status
      - startup_install
      - startup_uninstall
      - provider_status
    rules:
      - "Owner, reservation, and pause state remain in the adapter-owned WAL-mode SQLite store and survive restart. They are never copied into tracked config."
      - "Manager invokes only the fixed provider command and action set with separately validated scalar arguments; browser input never becomes an executable, script, shell fragment, store path, or runtime path."
      - "Responses are bounded typed JSON and omit credentials, engine child details, raw config, filesystem discovery, and database internals."
      - "Account controls do not require or read the bot token and cannot interrupt an active game."
  provider_status:
    schema: uci_arena_lichess_status_v3
    rules:
      - "Every operation Manager can expose is named in the published operation catalog. Manager resolves the fixed command prefix from that receipt-verified catalog; adding or replacing a conforming provider never relies on Manager-owned copies of provider command verbs."
      - "The service contract declares whether its CLI entrypoint executes directly or through one named dependency runtime and entrypoint. Manager never infers Node.js from a filename, provider id, or source layout."
      - "The status operation is credential-free and projects only bounded provider-owned runtime and startup evidence."
      - "Installed, registered, active, ready, stream connectivity, capacity, games, scheduler, rate-limit state, and actionable blockers are explicit; a stale runtime file never implies an active process."
      - "Every provider slot lifecycle state that affects admission is represented, including cancelling; status must not make occupied capacity disappear during remote challenge cancellation."
      - "Missing runtime evidence reports an inactive provider with blockers instead of failing the status operation."
      - "Status never returns credential contents, raw configuration, arbitrary logs, SQLite rows, or child-process command lines."
  validation:
    - "Contract checks compare the provider projection shape and fixed Manager operation bindings with the published closed schemas so wrapper or field drift fails before packaging."
    - "Unit tests cover complete projection, strict unknown-field rejection, valid atomic updates, invalid-update rollback, capacity-evidence rejection, and rated/outbound confirmation gates."
    - "Unit tests prove account probe, projection reads, and non-capacity updates remain usable with incomplete live-engine qualification while run, startup installation, and capacity changes remain fail-closed."
    - "Manager integration tests cover every account-control action and configuration group through the provider boundary without a shell and without contacting Lichess."
    - "Provider status tests cover missing state, stale/dead process evidence, active disconnected state, and active ready state without reading a credential."
    - "Runtime NDJSON logs rotate into one bounded retained predecessor; logging failures remain observable only through lost diagnostics and never interrupt a live game."
    - "Installed headless acceptance proves the configured bot is discoverable, its activity and blockers are visible, and account/options controls are reachable without opening a terminal."
    - "Release packaging includes only provider runtime files and the vendored contract runtime closure; provider tests, fabricated APIs, fixtures, source provenance history, and repository-only vendor locks are excluded."
    - "Release verification binds the outer provider result to the artifact and binds the internal provenance, component definition, component manifest, exact source identity, and exact passing test receipt before signing."

installer_component_contract_2026_08_01:
  status: active
  owner: lichess_provider_release_packaging
  purpose: >
    Publish one artifact that the independent Installer can validate through
    the suite-wide component protocol without learning Lichess source layout
    or synthesizing provider metadata.
  contracts:
    product_manifest: contracts/component-manifest.json
    install_manifest: arena-component.json
    service_contract: contracts/service-contract.json
    checksums: release/checksums.json
    provider_result: arena_provider_release_result_v1
    suite_installer_authority: iteathen/uci-arena-installer
    target_triples: [windows-x86_64, linux-x86_64]
  rules:
    - "The product manifest is provider-authored package data; the root install manifest is deterministically generated from it and the exact staged file inventory."
    - "Every staged regular file except the root install manifest is listed by exact size and SHA-256 in arena-component.json; symbolic links and unlisted payload files are forbidden."
    - "The service contract, Manager operation catalog, configuration schemas, status schema, entrypoints, dependencies, startup ownership, data paths, and credential gate are digest-bound component data rather than Installer branches."
    - "The provider publishes a bounded installer-integration entrypoint that owns Lichess configuration composition, prefers a validated external UCI locator when supplied, and otherwise uses the suite-declared compatible default engine binding."
    - "Installer supplies only declared dependency and saved-locator paths through the versioned installation context; it does not interpret Lichess configuration fields, engine-adapter semantics, qualification combinations, or knowledge-source UCI options."
    - "The install manifest declares the exact startup entrypoint, action arrays, runtime-directory/configuration flags, and response envelope. Installer may invoke credential-free uninstall from that contract but never fabricates Lichess arguments or reads a token."
    - "The outer provider result uses the shared suite field names and binds the exact artifact, install manifest, source repository and commit, source tree, dependency locks, toolchain, SBOM, licenses, build flags, and passing test receipt."
    - "The provider release remains component-only. It never claims suite composition authority and never packages, reads, hashes, or copies a credential."
    - "After keyless verification, the same explicitly dispatched job publishes the exact archive, provider result, and Sigstore bundle directly to one private immutable candidate prerelease. Actions artifact storage is not candidate transport."
    - "Target triples use the suite-wide windows-x86_64 and linux-x86_64 identifiers; executable filenames may retain the conventional windows-x64 label but catalog keys never do."
  validation:
    - "Release verification independently recomputes the install manifest inventory, internal checksums, SBOM and license identities, source and test-receipt bindings, and credential-free packaged status smoke."
    - "A second build from the same clean source, target, epoch, native launcher, and test receipt produces the same artifact digest."
    - "Installer substitution tests consume the artifact as an arbitrary component identity and reject a changed service contract, unlisted file, unsafe path, digest mismatch, or incompatible contract major before mutation."

provider_release_reproducibility_2026_08_01:
  status: active
  owner: lichess_provider_release
  rules:
    - "The signed provider result and native toolchain receipt bind the exact workflow branch ref plus GitHub run id and run attempt; a branch-only workflow identity is not release provenance."
    - "A Windows Lichess candidate builds its provider-owned launcher twice from independent empty build roots; repacking one launcher or staged payload is not reproducibility evidence."
    - "Both complete unsigned component archives and both provider-result predicates are byte-identical before signing or publication."
    - "The exact native toolchain receipt binds component id, target, source commit, workflow identity, and primary plus reproduction build roles."
    - "The Linux provider artifact contains no native launcher bytes and neither requires nor invents native toolchain evidence."
    - "A mismatch blocks publication and reports both archive digests plus the first differing payload path."
