meta:
  spec_id: lichess_match_scheduler_v1
  name: Configurable Lichess Match Scheduler
  version: 1
  status: active
  owner_subsystem: lichess_deploy_adapter
  created: '2026-07-20'
  purpose: >
    Keep UCI Arena occupied through capacity-safe automated bot challenges while
    preserving hard human access, owner reservations, independent engine
    processes, and durable opponent-specific performance evidence.

authority:
  transport_and_scheduler: iteathen/uci-arena-lichess-bot
  engine_move_selection: selected_external_uci_process
  durable_runtime_store: runtime_state/lichess/matches.sqlite
  timing_profile_consumption_contract:
    package: '@uci-arena/time-profile-contract'
    minimum_version: 1.2.0
    owner: uci_arena_engine
    distribution: immutable_digest_pinned_package_snapshot
  rules:
    - "The scheduler, Lichess API, reservations, statistics, capacity admission, startup, and provider persistence belong to the independent Lichess Bot repository."
    - "The Lichess Bot consumes an immutable UCI engine artifact and project-owned contract packages; it never imports engine repository source."
    - "The provider component manifest requires the neutral uci.engine.process capability. UCI Arena Engine is a compatible suite default chosen by product composition, not a hard provider dependency."
    - "The provider selects one explicit engine adapter at composition time. standard_uci_v1 accepts any conforming UCI process; uci_arena_extended_v1 adds UCI Arena runtime, timing, model, and evidence validation without weakening the neutral UCI boundary."
    - "One global event stream owns challenge/game lifecycle; each admitted game owns one independent qualified UCI child and game stream."
    - "An active game is never aborted or preempted to free a slot."
    - "Token contents never enter configuration, SQLite, logs, metadata, argv, or child environments."
    - "Every local installation supplies its own operator-owned token file outside the repository and immutable installed component roots. No release or test credential is bundled."

local_api_simulator:
  implementation: fake-api-server.mjs
  network: loopback_only_ephemeral_port
  credential: explicit_non_secret_test_fixture_value
  endpoints:
    - GET /api/account
    - GET /api/account/playing
    - GET /api/bot/online
    - GET /api/user/{username}
    - GET /api/stream/event
    - GET /api/bot/game/stream/{gameId}
    - POST /api/challenge/{challengeId}/accept
    - POST /api/challenge/{challengeId}/decline
    - POST /api/challenge/{challengeId}/cancel
    - POST /api/challenge/{username}
    - POST /api/bot/game/{gameId}/move/{move}
  rules:
    - "Automated HTTP adapter integration tests use the simulator instead of a real Lichess credential or public API; narrow unit tests may retain in-memory boundaries."
    - "At least one simulator test runs the complete adapter process, spawns a conforming UCI child, reconstructs an authoritative game stream, and observes the legal move POST at the HTTP boundary."
    - "An opt-in local-current-bundle simulator test composes configuration from the installer locator contract, launches the current extended UCI engine as an external child, applies the exact single-game, timing, capacity, opening-book, and Syzygy bindings, observes a legal move POST, records exact runtime provenance, and shuts down cleanly. Missing local artifact inputs skip this developer-machine test rather than substituting fixtures for release artifacts."
    - "The simulator rejects non-loopback binding, requires its explicit fixture bearer value on every API route, and never records Authorization."
    - "Request journals are bounded and retain only method, path, and bounded parsed form fields needed for assertions."
    - "NDJSON streams are finite deterministic fixtures so tests cannot hang while waiting for a live event."
    - "The simulator is test tooling only and cannot be selected by tracked production configuration or packaged as a runtime fallback."

configuration:
  schema: uci_arena_lichess_adapter_v7
  backward_compatibility: "v2/v3/v4/v5/v6 retain their declared migrations; new configuration is emitted as v7. Legacy documents without engine.adapter retain uci_arena_extended_v1 behavior."
  path_independence:
    - "Provider source and runtime paths resolve from the provider component root, never the process current working directory or a former engine-repository location."
    - "Engine executable, engine working directory, model, timing, capacity, and qualification paths enter explicitly from installed component discovery or invocation options."
    - "Path precedence is explicit invocation, then an absolute path authored in the supplied configuration document, then an ambient development fallback, then a portable template value. Placeholder expansion does not promote a template value into authored absolute authority, and ambient variables never replace installer-composed absolute model, single-game, timing, or temporal-curve authority."
    - "The tracked template uses an engine-component placeholder and does not name an engine source-tree layout."
    - "An engine may declare a bounded argument array for a direct process launch. Arguments are never concatenated into a shell command, and launch provenance binds the exact array plus any existing file arguments."
  credential:
    input: required_explicit_token_file_path
    ownership: operator_external
    rules:
      - "Probe, live run, and startup installation reject a missing token-file option; there is no repository-relative or packaged default."
      - "The resolved token path must be outside the adapter repository or installed provider component root."
      - "Explicit token-path validation occurs before engine qualification or startup installation work."
      - "Startup status and uninstall never require a credential path."
      - "Configuration loading recursively rejects credential-bearing field names and bearer values; token material cannot hide beneath an otherwise unknown object."
      - "Runtime token reads accept one bounded non-whitespace value from a regular file and never copy it into provider state."
  capacity:
    required: [total_slots, capacity_profile, human, bot]
    human: [slots, allow_borrowing, accept_public]
    bot: [slots, target_active]
    invariants:
      - total_slots_is_positive_integer
      - human_slots_plus_bot_slots_equals_total_slots
      - bot_target_active_between_zero_and_bot_slots
      - configured_total_does_not_exceed_qualified_max_concurrency
      - "A standard_uci_v1 engine receives one qualified slot from a fresh legal-move startup probe. More than one slot requires a capacity artifact binding the exact executable, UCI identity, applied options, and concurrent probe evidence."
  scheduler_defaults:
    enabled: true
    discovery_interval_seconds: 60
    challenge_interval_seconds: 5
    reservation_retry_seconds: 30
    challenge_timeout_seconds: 25
    max_games_per_opponent_per_day: 2
    timeout_cooldown_minutes: 30
    decline_cooldown_minutes: 360
    rated: false
    variant: standard
    clock: 180+2
  project_default:
    total_slots: 2
    human_slots: 1
    bot_slots: 1
    bot_target_active: 1
    human_slot_borrowing: false
    public_humans: true

capacity_profile:
  schemas: [uci_arena_lichess_capacity_profile_v1, uci_arena_lichess_capacity_profile_v2, uci_arena_lichess_standard_uci_capacity_profile_v1]
  required_bindings:
    - qualified
    - published_at
    - maximum_concurrency
    - engine_build_fingerprint
    - single_game_profile_sha256
    - model_fingerprint
    - provider_numeric_fingerprint
    - hardware_driver_fingerprint
    - evidence
  qualification: >
    Start and qualify the requested number of exact engine children concurrently,
    require the selected GPU provider and the complete telemetry contract for
    the profile-selected search core from every child, then close every child
    cleanly. Live MCGS profiles require MCGS graph, asynchronous inference,
    deadline-tail, root-coverage, and reservation-integrity telemetry; V2
    cursor fields have no MCGS authority. A smaller configured capacity may
    use a profile qualified at a greater capacity with identical bindings.
  failure: "Missing, stale, mismatched, or undersized capacity evidence blocks live run before credentials are read."

single_game_profile_publication:
  schema: uci_arena_single_game_profile_v1
  owner: lichess_provider_profile_publisher
  rules:
    - "The stable evidence field names are compatibility keys; validation and publication select search-core-specific semantics from the qualified timing-profile identity."
    - "Publication consumes the immutable qualified uci_time_profile_v3 artifact, not an intermediate diagnostic attempt. The timing profile must bind the exact semantic timing/search contract, model, adapter, provider/runtime, hardware/driver, search topology, and at least thirty repetitions per declared case. Its executable digest remains provenance and may differ after a timing-compatible rebuild; the independent complete-game and single-game evidence still bind the exact current executable."
    - "MCGS publication requires the timing profile's complete MCGS graph-population, legal-root-coverage, asynchronous-overlap, single-owner, fallback, reservation-integrity, temporal-policy, and deadline-tail gates. V2 cursor counters cannot satisfy any MCGS gate."
    - "The complete-game artifact must bind the same executable, model, provider, topology, and search-core-specific runtime fields. MCGS requires positive graph, simulation, asynchronous-admission, and overlap evidence, complete legal-root seeding, and zero stale backups, leaked reservations, active tickets, or active asynchronous leases."
    - "The complete-game artifact must also prove that it validated and applied the same qualified timing-profile file and semantic identity before its timed diagnostic work. Publication verifies the exact provider, backup/emission, and forecast calibration values; an executable-only provenance difference does not revoke timing authority, while omitted, rejected, mismatched, or unapplied timing authority fails publication."
    - "MCGS graph size, Cpuct, outstanding-batch limit, and book-prior blend are copied from qualified identity rather than supplied independently by the operator."
    - "When complete-game evidence selects Syzygy, publication copies its exact external path, manifest path and file SHA-256, manifest identity/cardinality, probe limit and worker topology, rule-50 policy, and root/internal activation into the single-game profile. Publication revalidates the current manifest file before replacing the profile; absent tablebases remain an explicit no-tablebase qualification mode."
    - "Publication validates every input before replacing the profile and copies the exact timing profile plus complete-game artifact beside it; a rejected attempt leaves the prior authoritative profile unchanged."
    - "V2 profiles remain parseable historical evidence but cannot pass the live adapter's MCGS startup gate."

engine_adapters:
  selection: explicit_configuration
  standard_uci_v1:
    required_protocol:
      - "The child completes uci/uciok and isready/readyok within bounded time."
      - "Only options advertised by that child may be applied. Missing optional Ponder or Move Overhead disables the corresponding optimization rather than rejecting an otherwise conforming engine."
      - "A fresh start-position qualification search must return a syntactically valid and independently legal move before a slot may be admitted."
      - "Clocked move search uses only standard position and go wtime/btime/winc/binc commands. Opponent-turn search uses standard go ponder when supported and otherwise remains disabled."
      - "Standard-UCI execution never requires runtime_status, MCGS telemetry, a model package, ONNX provider identity, a UCI Arena timing profile, or UCI Arena-owned option names."
    provenance:
      - "Every game binds executable SHA-256, normalized UCI id lines, advertised-option identity, applied options, and adapter identity. Model, provider, and UCI Arena timing fields remain explicitly absent rather than invented."
  uci_arena_extended_v1:
    required_protocol:
      - "The existing exact single-game, model, provider, MCGS, timing, capacity, opening-book, and tablebase gates remain authoritative."
      - "Opening-book publication remains independent of single-game search qualification so Book Forge may publish a newer conforming uci_arena_book_snapshot_v2 snapshot without regenerating timing evidence. When the same-basename .stats and .policy pair is present, the adapter derives the configured book binary's expected FNV-1a identity from its bounded stats header and requires the engine's successful enhanced validation to report that exact loaded identity after restoring OwnBook. With both sidecars absent, the Engine-owned base Polyglot capability remains usable and runtime identity is bound from the live Engine report without inventing Book Forge statistics or hint authority."
      - "Installer composition for uci_arena_extended_v1 requires one regular non-link book binary. A same-basename .stats and .policy pair is optional but atomic: both valid regular non-link paths are supplied together or neither is supplied. A partial pair fails configuration, while an absent pair explicitly clears sidecar options instead of falling through to unrelated engine defaults."
      - "When a single-game profile binds Syzygy, runtime qualification requires exact active cardinality, manifest identity, probe limit and worker topology, rule-50 policy, and root/internal activation; retained files without a current matching profile and live runtime report have no installation or play authority."
      - "Profile-owned Syzygy path conflicts are decided from normalized absolute platform path identity, not raw separator, case, dot-segment, or trailing-separator spelling. A genuinely different tablebase or manifest still fails closed and content identity remains independently validated."
      - "Extended telemetry is validated only inside this adapter and never becomes a requirement of standard_uci_v1."
  substitution:
    - "Selecting standard_uci_v1 or uci_arena_extended_v1 changes adapter-owned qualification and telemetry validation only; Lichess streams, legality, challenge policy, persistence, slot admission, and move submission remain unchanged."
    - "Account probe and credential validation do not require an engine to be configured or qualified. Live run and startup registration do."
    - "The packaged UCI smoke delegates process launch, configured literal arguments, option validation, and qualification to the selected engine adapter; it never independently requires UCI Arena-only commands from standard_uci_v1."
  process_boundary:
    - "UCI option names and values are bounded single-line protocol values; configuration cannot inject additional UCI commands."
    - "Engine stdout protocol lines, retained identity lines, and projected stderr are bounded. Protocol overflow terminates the child and fails pending work."

protected_live_acceptance:
  capacity: {total_slots: 1, human_slots: 0, bot_slots: 1, bot_target_active: 0}
  runtime_bindings:
    - "The harness passes the installed engine executable, its immutable component root as working directory, the installed model root, and the shared Manager knowledge root explicitly."
    - "The harness may omit a calibrated time profile; conservative timing fallback remains visible and does not weaken exact engine/model/provider/single-game/capacity qualification."
  rules:
    - "Acceptance disables public inbound challenges and automatic scheduling and permits only the one explicitly named casual BOT opponent."
    - "Current target availability is proven by membership in the canonical api/bot/online NDJSON result. The public user profile supplies identity, BOT title, and disabled-account state but its optional online field is not authoritative."
    - "A capacity profile qualified for one exact child is sufficient because the protected harness cannot admit a second game."

slots:
  states: [empty, preparing, pending, active, draining]
  rules:
    - "A pending inbound acceptance or outbound challenge consumes exactly one audience slot."
    - "Prepare and qualify the UCI child before accepting or creating the challenge."
    - "An outbound timeout must cancel the still-live Lichess challenge before closing its child and releasing its slot. If cancellation races acceptance or fails, retain the pending slot and reconcile instead of allowing a late gameStart to overbook the pool."
    - "On confirmed decline, cancellation, preparation failure, or terminal game, close the child and release the slot exactly once."
    - "Concurrent timeout and terminal-event release attempts coalesce while the slot is draining; the slot cannot become empty or be reacquired until its owned engine has closed."
    - "Human and bot pools are hard partitions for challenge admission unless allow_borrowing is explicitly true. An already-started game recovered from Lichess may use any otherwise empty qualified slot after its native audience pool is exhausted; recovery never preempts an active game."
    - "Owner reservations claim the next human slot; while claimed, non-owner human challenges receive later."
    - "Public humans may use unreserved human slots; BOT-title challengers use only bot slots."
    - "On restart, reconcile /api/account/playing before creating or accepting new work."
    - "After a global event-stream disconnect, reconnect with bounded exponential backoff and reconcile /api/account/playing before resuming scheduling so a gameStart event lost during the gap is recovered."
    - "Game admission is serialized by game id. Concurrent event-stream and reconciliation observations coalesce into one start, one child, one stream, and one slot generation."
    - "Every asynchronous slot transition and release is authorized by the generation captured when the slot was claimed; a stale callback can never mutate or release a later occupant."
    - "An outbound gameStart that races the challenge-create response adopts the already preparing opponent slot. The late create response may attach its challenge id but cannot move an active slot backward to pending or release its engine."
    - "A disconnected per-game stream reconnects and reconstructs position from authoritative gameFull/gameState moves without releasing its active slot."
    - "Repeated per-game stream failures retain the active slot and qualified child while retrying with bounded backoff. A retry-count threshold never converts an unfinished remote game into a local terminal session; only authoritative terminal state or explicit whole-provider shutdown ends it."

owner_control:
  storage: runtime_sqlite_only
  commands:
    - owner_add_remove_list
    - reserve_with_opponent_games_and_expiry
    - reservation_status_cancel
    - scheduler_status_pause_resume
  defaults: {reservation_games: 1, reservation_minutes: 15}
  rules:
    - "Owner identities are never committed in tracked configuration."
    - "Owner challenges and reservations have priority within the human pool but never preempt an active game."
    - "Reservations survive adapter restart and expire by UTC time."

opponent_scheduler:
  discovery: "GET /api/bot/online?nb=512 as NDJSON; webpage scraping is forbidden."
  selection_factors:
    positive: [rating_proximity, acceptance_probability, under_sampling, color_balance, freshness]
    negative: [recent_repetition, decline, timeout, cooldown]
  randomization: weighted_random
  rules:
    - "Never challenge self, an offline/stale candidate, a cooled-down opponent, or an opponent at its daily game cap."
    - "Create outbound challenges one request at a time, at least challenge_interval_seconds apart, until target_active is reserved by pending plus active bot slots."
    - "Game move submission has highest request priority, but no request class bypasses an active HTTP 429 cooldown."

storage:
  engine: node_sqlite
  journal_mode: WAL
  schema_version: 3
  tables: [schema_meta, owners, reservations, scheduler_control, opponents, challenge_attempts, games, api_safety_state, api_client_leases]
  invariants:
    - "Opening an existing schema-v3 store idempotently materializes every required table. A superseded api_rate_limit singleton is imported as a conservative legacy-global safety row so a branch or adapter upgrade cannot erase or shorten an unexpired 429 cooldown."
    - "Game id and challenge id ingestion are idempotent."
    - "Every game immutably binds opponent, color, time control, result, engine build, model id/fingerprint/checkpoint/adapter, provider/numeric/runtime/hardware identity, complete search and batching options, timing-profile identity and permissions, semantic timing-authority match, qualified-versus-current engine provenance comparison, and configured plus observed opening-book state."
    - "When AdaptiveCurveV1 is active, every game additionally binds the validated temporal-curve artifact revision, file sha256, evidence-manifest sha256, formula identity, and complete applied coefficient UCI options."
    - "The games row stores queryable core identity columns plus a versioned uci_arena_game_runtime_provenance_v1 JSON document and its sha256. The JSON includes the complete effective post-qualification UCI option map so later defaults cannot reinterpret a historical game; timing-profile provider, backup/emission, and forecast reserves must overwrite their pre-application defaults in both the option map and typed timing fields."
    - "Idempotent game-start replay may update opponent and clock metadata but never replaces runtime provenance for an existing game id. Legacy rows migrate without invented provenance and remain explicitly distinguishable by an empty provenance hash."
    - "Historical provenance may be backfilled only into blank provenance fields from an explicit, reviewable evidence manifest whose runtime identity is bound to an already-recorded game fingerprint and a bounded UTC interval. Backfill never overwrites non-empty identity, records evidence sources and unknown fields in the versioned JSON, is transactional, and reports matched, updated, skipped, and conflicting rows."
    - "Aggregates remain derivable from immutable game rows and separable by runtime identity."
    - "Startup reconciliation may fill missing terminal results without duplicating games."
    - "Reservation consumption is one SQLite transaction so a concurrent Manager cancellation or replacement cannot decrement or delete a different reservation."
    - "Persisting API safety state never shortens cooldown or replaces a newer strike observation with stale state."

windows_supervision:
  task_name: UCI Arena Lichess Adapter
  installed_launcher: native/lichess_adapter_launcher.exe
  development_build_output: native/build/Release/lichess_adapter_launcher.exe
  rules:
    - "The registered logon task is hidden, least-privilege, single-instance, network-gated, unlimited-duration, and restarted after failure."
    - "The task starts a Windows GUI-subsystem launcher; the launcher creates the foreground Node adapter with CREATE_NO_WINDOW and supervises it in a kill-on-close job."
    - "The Node adapter remains the foreground child of the launcher so Task Scheduler observes its real exit code; no detached intermediate process is permitted."
    - "The adapter writes runtime_state/lichess/adapter.ndjson and runtime.json because supervised stdout and stderr are intentionally attached to NUL."
    - "Startup registration may persist only the token-file path, never token contents, and must validate engine/capacity evidence before registration."

telemetry:
  runtime_schema: uci_arena_lichess_runtime_v3
  fields:
    - configured_and_qualified_capacity
    - active_pending_preparing_by_audience
    - scheduler_pause_and_reservation
    - discovery_and_challenge_timestamps
    - aggregate_and_per_opponent_wdl
    - adapter_and_engine_identity
    - api_cooldown_deadline_and_backoff_level
    - api_queue_depth_and_in_flight_request_class
    - api_429_counts_and_client_lease_health
  status_authority:
    - "A live PID is insufficient authority for active or ready. Runtime evidence older than the bounded heartbeat window is stale even if that PID has been reused by another process."
    - "Status distinguishes missing, invalid, stale, inactive, disconnected, scheduler-faulted, and ready states without reading a credential."

transport_bounds:
  rules:
    - "Every JSON or NDJSON response crossing the Lichess boundary has a byte bound before complete buffering or parsing. Long-lived streams are unbounded in duration but each record is bounded."
    - "Finite discovery results have an item bound consistent with the requested Lichess limit. Oversized bodies, records, and result sets fail closed with bounded errors."
    - "Successful empty-response operations cancel or boundedly drain unexpected response bodies; error-detail extraction never buffers an arbitrary response document."

validation:
  - "Config fixtures cover v2 compatibility, 1, default 1+1, 16-game layouts, invalid sums, and capacity-profile rejection."
  - "Deterministic scheduler tests prove owner priority, hard human capacity, zero overbooking, timeout/decline cooldowns, daily caps, and weighted selection."
  - "SQLite tests prove migration, WAL operation, idempotent challenge/game writes, reservations, restart recovery, and identity-separated WDL."
  - "Mock API tests prove discovery, serialized challenge operations, move priority, 429 backoff, cancellation-before-timeout-release, late-accept retention, active-game recovery borrowing, and event races."
  - "Loopback API-server integration proves real HTTP account probing, bearer rejection, BOT rejection, NDJSON discovery/stream parsing, challenge creation, and move submission without contacting Lichess."
  - "Concurrent engine tests require legal moves, isolated children, bounded startup, and graceful cleanup at every claimed capacity."
  - "Substitution tests run a minimal standard UCI fixture with no UCI Arena options or runtime_status and prove qualification, legal move submission, provenance, and one-slot admission."
  - "Race tests prove duplicate gameStart/reconciliation and outbound create-response reordering cannot create two children, two streams, a leaked slot, or a stale-generation release."
  - "Reconnect tests exceed the former retry threshold without ending the active session or releasing its authority."
  - "Transport tests reject oversized JSON, NDJSON records, and finite collections before unbounded buffering."
  - "Packaged Windows startup tests resolve the launcher at native/lichess_adapter_launcher.exe rather than a source-build directory."

adaptive_temporal_curve_profile_2026_07_25:
  status: active
  schema: uci_arena_mcgs_adaptive_temporal_curve_v1
  canonical_path: engine/runtime/time/mcgs_adaptive_curve_v1.json
  authority:
    - "Offline experiment tooling owns fitting and atomic publication. The adapter owns validation, startup application, and provenance. The engine owns deterministic evaluation of the fixed formula."
    - "The artifact may tune only AdaptiveCurveV1 coefficients. It has no authority to select a search core, model, provider, worker topology, opening book, tablebase, scheduler, or API behavior."
  startup:
    - "A live MCGS config selects exactly one temporal authority: the qualified static EarlyCurrent profile, or one qualified_live_authority temporal-curve artifact."
    - "The tracked live default is EarlyCurrent with no temporal-curve artifact. Evidence-gated and provisional artifacts are non-live and cannot displace that default."
    - "When a temporal-curve artifact is selected, the adapter validates schema, qualified status, revision, coefficient types/ranges, internal evidence-manifest identity, and file fingerprint before engine startup."
    - "The adapter applies only the exact allowlisted curve UCI options and requires the engine to advertise every option."
    - "The artifact is immutable for an engine-child generation. A later atomic publication is observed only by a later child startup, never during an active game."
  provenance:
    - artifact_path
    - artifact_sha256
    - revision
    - status
    - evidence_manifest_sha256
    - formula
    - applied_uci_options
  failure:
    - "Missing, malformed, unsupported, non-deployable, out-of-range, or identity-inconsistent artifacts block live startup before credentials are read."
    - "No implicit fallback to EarlyCurrent, CurveExperiment, V2, legacy search, or embedded untracked coefficients is permitted after AdaptiveCurveV1 is explicitly configured."
  validation:
    - "Fixtures accept the qualified static default and a qualified adaptive revision, and reject evidence-gated, schema, status, range, hash, unknown-option, and config-conflict errors."
    - "UCI startup reports AdaptiveCurveV1 and the exact effective coefficients; per-game provenance binds the same artifact and option identity."

opponent_turn_time_management_2026_07_20:
  status: active
  configuration:
    schema: uci_arena_lichess_adapter_v5
    backward_compatibility: "v2/v3/v4 retain their declared transport reserve; v5 enables adapter-scoped transport-profile selection with a 650 ms bootstrap reserve."
    timing_defaults:
      opponent_turn_search: true
      foreground_preempts_ponder: true
      initial_transport_reserve_ms: 650
      transport_profile_path: runtime_state/lichess/transport_profile_v2.json
  authority:
    - "The streamed full move list, game status, clocks, side to move, and game id are authoritative. A locally predicted move never advances canonical game state."
    - "The adapter never submits a move before an authoritative state says it is the bot's turn. Lichess has no premove endpoint."
    - "A prepared reply is usable only when the exact move-list delta, predicted opponent move, independently replayed legal root, and engine/model/provider generation match."
    - "Every candidate is proven legal at the exact authoritative root immediately before the queued move request is eligible to dispatch."
  state_machine:
    - "After a successful bot move POST, start explicit go ponder on the engine's predicted reply; if none exists, start explicit opponent-root go infinite for cache warming."
    - "A matching authoritative opponent move sends ponderhit. An identical duplicate retains the current search; a miss, reconnect, clock correction, takeback, model change, or terminal state stops and drains the invalidated go before reconstruction."
    - "Stream intake remains live while a foreground search or move request is pending. A newer authoritative observation cancels the foreground waiter, and a move queued behind other API work revalidates authority immediately before fetch dispatch."
    - "HTTP 400 triggers authoritative reconciliation and never blind replay. HTTP 429 follows global backoff while retaining move-request priority."
    - "Across isolated game children, any timed foreground search preempts other ponders unless the exact capacity profile separately qualifies simultaneous foreground and ponder load."
  clock_contract:
    - "Subtract measured local state-processing delay before go and reserve the configured or qualified inbound-plus-submit transport tail through Move Overhead."
    - "Transport timing remains adapter-scoped and separate from model/provider timing calibration."
    - "A uci_arena_lichess_transport_profile_v2 requires at least 200 successful move samples from at least ten completed games. Each sample covers bestmove receipt through legality replay, serialized move-queue wait, request dispatch, and acknowledgement. Its reserve is p99 bestmove-to-ack plus 50 ms, rounded upward to 50 ms and clamped to 250 through 1500 ms."
    - "A qualified v1 dispatch-to-ack profile remains readable as a read-only legacy authority, but is never rewritten as v2 and cannot claim coverage for legality or queue latency."
    - "Compatible qualified transport evidence does not lose authority merely because wall-clock time passed. Its age remains visible provenance; only a measurement-contract incompatibility, invalid evidence, or replacement evidence from completed games can change transport authority."
    - "A missing, incompatible, invalid, or unqualified transport profile selects the 650 ms bootstrap reserve. V2 retains a bounded rolling window of the latest 2000 valid samples, incorporates new observations only after a game completes, and changes the effective reserve only between games."
    - "Move observations remain isolated as non-authoritative pending samples by game id. Only an authoritative terminal game observation commits that game's samples; session failure, shutdown, or abandonment discards them, and completion of another game cannot adopt them."
    - "Transport learning writes only the adapter-owned transport profile and effective transport reserve. It never rewrites, replaces, or changes the authority of the Engine-owned timing profile or a selected temporal-curve artifact."
    - "Opponent-turn search is enabled only after the exact semantic timing authority is accepted and applied. Qualified-versus-current executable drift is retained as provenance and does not disable the curve when the timing/search contract, model semantics, provider/runtime, hardware, and effective topology still match. Missing or rejected timing evidence retains conservative foreground search and the bootstrap transport reserve, and disables ponder/opponent-root work before live play."
  telemetry:
    - state_received_to_go_ms
    - go_to_bestmove_ms
    - state_validated_to_post_ms
    - post_to_ack_ms
    - authoritative_wtime_ms
    - authoritative_btime_ms
    - go_wtime_ms
    - go_btime_ms
    - bestmove_to_ack_ms
    - timing_profile_status
    - timing_profile_provider_safety_qualified
    - timing_profile_forecast_shadow_qualified
    - timing_profile_adaptive_play_qualified
