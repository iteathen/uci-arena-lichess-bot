meta:
  spec_id: lichess_match_scheduler_v1
  name: Configurable Lichess Match Scheduler
  version: 1
  status: active
  owner_subsystem: lichess_deploy_adapter
  created: '2026-07-20'
  purpose: >
    Keep UCI Arena occupied through capacity-safe automated bot challenges while
    preserving hard human access, owner reservations, independent engine
    processes, and durable opponent-specific performance evidence.

authority:
  transport_and_scheduler: iteathen/uci-arena-lichess-bot
  engine_move_selection: selected_external_uci_process
  durable_runtime_store: provider_workspace/matches.sqlite
  timing_profile_consumption_contract:
    package: '@uci-arena/time-profile-contract'
    minimum_version: 1.2.0
    owner: uci_arena_engine
    distribution: immutable_digest_pinned_package_snapshot
  rules:
    - "The scheduler, Lichess API, reservations, statistics, capacity admission, startup, and provider persistence belong to the independent Lichess Bot repository."
    - "The Lichess Bot consumes an immutable UCI engine artifact and project-owned contract packages; it never imports engine repository source."
    - "The provider component manifest requires the neutral uci.engine.process capability. UCI Arena Engine is a compatible suite default chosen by product composition, not a hard provider dependency."
    - "The provider selects one explicit engine adapter at composition time. standard_uci_v1 accepts any conforming UCI process; uci_arena_extended_v1 adds UCI Arena runtime, timing, model, and evidence validation without weakening the neutral UCI boundary."
    - "One global event stream owns challenge/game lifecycle; each admitted game owns one independent qualified UCI child and game stream."
    - "An active game is never aborted or preempted merely to free a slot. The sole automatic-abort exception is a standard zero-ply game where this bot is Black and the configured first-move deadline expires while authoritative state still says White has not moved."
    - "Token contents never enter configuration, SQLite, logs, metadata, argv, or child environments."
    - "Every local installation supplies its own operator-owned token file outside the repository and immutable installed component roots. No release or test credential is bundled."

provider_replacement_interlock_2026_08_23:
  status: active
  owner: provider_scheduler_and_durable_runtime_store
  lifecycle_operation: pre_replace
  purpose: >
    Refuse component or dependency replacement while provider-owned game,
    challenge-admission, or reconciliation work could be interrupted, without
    transferring Lichess or scheduler semantics to Installer.
  contract:
    - "The existing neutral pre_replace lifecycle operation is the only replacement-quiescence port. No game-specific Installer operation, disposition, callback, or filesystem inspection is introduced."
    - "The provider owns one durable admission gate in its existing matches.sqlite authority. Every preparing, pending, cancelling, or active slot holds provider-work authority from before its first external challenge mutation until exact generation-owned release; startup reconciliation holds the same authority until every observed remote game is either admitted or rejected."
    - "Provider-work admission and gate closure serialize through one immediate store transaction. If admission wins, pre_replace observes active work and fails without closing the gate. If pre_replace wins, later work admission fails before engine startup or a Lichess challenge mutation."
    - "Pre_replace may report replacement-ready only when the gate is closed, active provider work is zero, and the running provider implements the exact interlock contract. Canonical archive completeness remains preserved for bounded reconciliation/backfill but is not a second provider-lifecycle authority: a stale historical live row cannot by itself deadlock replacement after its external work authority has been released."
    - "Active provider work, legacy-uncoordinated, malformed, or unavailable interlock evidence returns one bounded provider-owned failure reason. Installer treats that reason as opaque and performs no provider-specific branch."
    - "Typed startup install/uninstall/pre_replace/post_replace fatal boundaries emit exactly one arena_provider_lifecycle_result_v1 failed frame with unknown observations and nonzero exit. They emit no raw stderr or arbitrary exception message. reason.id is a closed startup failure category; reason.message is bounded JSON containing only an allowlisted error code and, when verified against the published component file inventory and actual source hash, a relative source path/line/column/hash. Missing or invalid diagnostic inventory omits source and never turns failure into success. Non-typed startup and non-startup fatal behavior remains unchanged."
    - "A failed active-work check leaves the current process, engine children, games, startup registration, and open admission gate unchanged. It never disables supervision, stops a process, retargets a root, or aborts a game. A later safe retry is permitted."
    - "After successful gate closure, startup control may disable restart, stop the now-idle exact owned process tree, and retarget the registration. Failure during that platform transition reopens admission before returning when the current provider remains authoritative."
    - "Post-replacement resume reopens admission only through provider-owned lifecycle code. A blocked provider process cannot clear the gate merely by restarting, so a restart race cannot invalidate successful pre_replace evidence."
    - "The gate, work count, lifecycle owner, and failure observations are credential-free. No lifecycle path reads, hashes, copies, validates, logs, or returns token contents."
    - "Public startup status adds replacementInterlock as ready with only admissionBlocked/owned/activeWork, unavailable with storage_absent, or failed with the existing sanitized diagnostic. The storage owner opens an existing exact database readOnly with the admitted schema and read transaction, without initialization, migration, repair, pruning, or any provider row mutation. Missing database creates nothing. Ordinary SQLite WAL/SHM creation and read-lock/readmark coordination are permitted read transport at exact admitted sidecar targets; they are not provider state changes. Immutable reads that ignore current WAL are forbidden. Status never closes admission or grants replacement-ready authority."
    - "Explicit maintenance recover is separate authenticated run authority before engine admission, never a startup lifecycle operation. It reads an external credential only inside the provider transport and issues GET account, current challenges, then current games under the existing cooldown coordinator. It starts no engine, stream, scheduler or outbound account action. Startup must already be absent or explicitly disabled and inactive. Exact prior process absence or PID reuse, current exclusive API lease, authenticated expected BOT account and complete empty remote work must all hold before reclamation; lease expiry alone cannot prove process absence. A missing prior lease may use the provider's retained exact runtime process identity; missing or unverifiable ownership defers."
    - "Maintenance admits only existing exact storage through the current schema validators with the lifecycle extension required, without migration, repair, reservation pruning or game/history mutation. One immediate completion transaction rechecks the original owner/count/update/gate, exclusive lease, absence of ambiguous durable challenge work and prior-process evidence, then clears abandoned work/ownership and releases its exact maintenance lease together. Failure/defer preserves work and gate, except normal maintenance lease/cooldown bookkeeping. Missing scope, pending or malformed remote work, cancellation and authority drift never force-zero. Closed recovered/deferred/failed output contains only controlled facts; commit or lease/storage cleanup uncertainty remains failed. Lifecycle replacement compensation remains a separate credential-free convergence responsibility."
    - "Maintenance authentication/scope failures may add only a controlled phase account/challenges/playing and numeric HTTP status 401/403, captured once and retained across cleanup failure. No error body, account/challenge/lease identifier or credential is returned. Missing challenge-read authority cannot be replaced by empty games, local history or an unsynchronized event stream; the required remote proof remains unavailable and recovery defers."
    - "Existing startup-control v3 pre/post operations implement provider-owned state convergence with the same private intent, now version 2. Existing compatible schema 5 with its lifecycle extension or schema 6 is admitted without migration, pruning or history mutation; missing storage fails closed without creating a database. The exact bounded platform before-image and prospective closed interlock tuple are persisted inside the existing immediate admission transaction before gate/platform effects. Failed preparation retains the gate until an admitted target is proved. No second wire operation, transaction-id service or Installer-specific recovery branch is introduced."
    - "Completed retries require the same full invocation authority and actual registration/action/definition/enablement/running intent; a later changed same-root baseline is captured anew. Task instance GUID changes alone do not change running intent. Same-root inverse convergence must prove the requested complete prior Node/config/runtime/profile action, never infer rollback from root equality. Matching completed targets may be observed without new gate or platform effects. Foreign task/state/gate and unresolved work fail closed. Historical completed v1 inactive compensation may prove the prior inactive target and exact old-process absence while retaining every interlock field, positive historical work and intent; it grants no new forward readiness."
    - "The same private v2 intent serializes pre/post controller ownership through the existing immediate claim callback. An unfinished exact live or unverifiable controller defers another caller; transfer requires exact absence or PID reuse, not expiry. In-process exported replacement calls reject overlap. No separate table, wire identifier or service is added. Ordinary new-provider release preserves a closed gate tuple; recognition of a legacy release requires its captured exact process gone/reused, old lease absent and an immediate exact released-tuple recheck. Unknown release, gate drift and combined storage/platform cleanup failure remain failed and preserve their controlled cause."
  migration:
    store_schema_base: 5
    compatible_extension: provider_lifecycle_control
    rules:
      - "Migration creates one additive closed-shape provider lifecycle control row while retaining base schema 5, so the prior provider version may ignore the extension and restart after an unsuccessful staged update. Every prior scheduler, game, challenge, cooldown, lease, and provenance row is preserved."
      - "A pre-interlock provider is not assumed safe: missing exact lifecycle ownership fails closed unless platform authority already proves the registration explicitly disabled and inactive. An active or restart-enabled legacy registration cannot race staged replacement."
      - "A newly claimed run authority may discard stale in-memory work counts only after the existing single-client lease proves exclusive process ownership; it never clears an outstanding replacement gate."
  validation:
    - "A live-session fixture invokes pre_replace, receives the active-work failure, observes no platform-control call, and proves the same game task, slot generation, and engine remain active until normal terminal completion."
    - "Transaction tests prove both race orders: admitted work blocks replacement, while closed replacement admission blocks new work before external mutation."
    - "Idle, repeated, legacy-uncoordinated, stale-owner, active-work, stale-archive, platform-failure compensation, and post-replacement resume cases fail closed or converge as declared."
    - "Windows and Linux startup tests prove no disable, stop, delete, retarget, or enable action occurs after an unsafe interlock result."

local_api_simulator:
  implementation: fake-api-server.mjs
  network: loopback_only_ephemeral_port
  credential: explicit_non_secret_test_fixture_value
  endpoints:
    - GET /api/account
    - GET /api/account/playing
    - GET /api/bot/online
    - GET /api/user/{username}
    - GET /api/stream/event
    - GET /api/bot/game/stream/{gameId}
    - POST /api/challenge/{challengeId}/accept
    - POST /api/challenge/{challengeId}/decline
    - POST /api/challenge/{challengeId}/cancel
    - POST /api/challenge/{username}
    - POST /api/bot/game/{gameId}/move/{move}
    - POST /api/bot/game/{gameId}/abort
  rules:
    - "Automated HTTP adapter integration tests use the simulator instead of a real Lichess credential or public API; narrow unit tests may retain in-memory boundaries."
    - "At least one simulator test runs the complete adapter process, spawns a conforming UCI child, reconstructs an authoritative game stream, and observes the legal move POST at the HTTP boundary."
    - "An opt-in local-current-bundle simulator test composes configuration from the installer locator contract, launches the current extended UCI engine as an external child, applies the exact single-game, timing, capacity, opening-book, and Syzygy bindings, observes a legal move POST, records exact runtime provenance, and shuts down cleanly. Missing local artifact inputs skip this developer-machine test rather than substituting fixtures for release artifacts."
    - "The simulator rejects non-loopback binding, requires its explicit fixture bearer value on every API route, and never records Authorization."
    - "Request journals are bounded and retain only method, path, and bounded parsed form fields needed for assertions."
    - "NDJSON streams are finite deterministic fixtures so tests cannot hang while waiting for a live event."
    - "The simulator is test tooling only and cannot be selected by tracked production configuration or packaged as a runtime fallback."

configuration:
  schema: uci_arena_lichess_adapter_v8
  backward_compatibility: "v2/v3/v4/v5/v6 retain their declared migrations; v7 documents migrate challenge_interval_seconds to the v8 safety floor; new configuration is emitted as v8. Legacy documents without engine.adapter retain uci_arena_extended_v1 behavior."
  path_independence:
    - "Provider source paths resolve from the provider component root. Persistent runtime paths resolve first from an explicit runtime-directory argument, then from the parent of an explicitly supplied provider configuration, and otherwise use the component-root development fallback. An installed configuration must therefore keep mutable runtime state in its preserved provider workspace, never the immutable component root, process current working directory, or a former engine-repository location."
    - "Engine executable, engine working directory, model, timing, capacity, and qualification paths enter explicitly from installed component discovery or invocation options."
    - "Path precedence is explicit invocation, then an absolute path authored in the supplied configuration document, then an ambient development fallback, then a portable template value. Placeholder expansion does not promote a template value into authored absolute authority, and ambient variables never replace installer-composed absolute model, single-game, timing, or temporal-curve authority."
    - "The tracked template uses an engine-component placeholder and does not name an engine source-tree layout."
    - "An engine may declare a bounded argument array for a direct process launch. Arguments are never concatenated into a shell command, and launch provenance binds the exact array plus any existing file arguments."
  credential:
    input: required_explicit_token_file_path
    ownership: operator_external
    rules:
      - "Probe, live run, and startup installation reject a missing token-file option; there is no repository-relative or packaged default."
      - "The resolved token path must be outside the adapter repository or installed provider component root."
      - "Explicit token-path validation occurs before engine qualification or startup installation work."
      - "Startup status and uninstall never require a credential path."
      - "Configuration loading recursively rejects credential-bearing field names and bearer values; token material cannot hide beneath an otherwise unknown object."
      - "Runtime token reads accept one bounded non-whitespace value from a regular file and never copy it into provider state."
  capacity:
    required: [total_slots, capacity_profile, human, bot]
    human: [slots, allow_borrowing, accept_public]
    bot: [slots, target_active]
    invariants:
      - total_slots_is_positive_integer
      - human_slots_plus_bot_slots_equals_total_slots
      - bot_target_active_between_zero_and_bot_slots
      - configured_total_does_not_exceed_qualified_max_concurrency
      - "A standard_uci_v1 engine receives one qualified slot from a fresh legal-move startup probe. More than one slot requires a capacity artifact binding the exact executable, UCI identity, applied options, and concurrent probe evidence."
  scheduler_defaults:
    enabled: true
    discovery_interval_seconds: 60
    challenge_interval_seconds: 300
    reservation_retry_seconds: 30
    challenge_timeout_seconds: 25
    first_move_timeout_seconds: 60
    max_games_per_opponent_per_day: 2
    timeout_cooldown_minutes: 30
    decline_cooldown_minutes: 360
    rated: false
    variant: standard
    clock: 180+2
  project_default:
    total_slots: 2
    human_slots: 1
    bot_slots: 1
    bot_target_active: 1
    human_slot_borrowing: false
    public_humans: true

exact_file_authority:
  owner: lichess_provider_exact_file_component
  role: provider_local_filesystem_adapter
  limits:
    path_utf8_bytes: 32768
    credential_bytes: 4096
    configuration_bytes: 1048576
    runtime_status_bytes: 1048576
    startup_definition_bytes: 1048576
    transport_profile_bytes: 4194304
    profile_manifest_and_evidence_bytes: 16777216
    engine_argument_file_bytes: 67108864
    executable_book_and_tablebase_asset_bytes: 17179869184
  rules:
    - "One provider-local exact-file component owns bounded regular-file admission, streaming SHA-256, exact byte reads, append authority, and atomic file publication. Domain parsing and policy remain with their existing provider owners."
    - "Every admitted path and existing ancestor is bounded and must be a real directory or regular final file rather than a symlink, junction, reparse substitution, device, socket, FIFO, or other special object."
    - "Reads and hashes bind pre-open path identity, opened descriptor identity and size, post-use descriptor identity, and post-use path identity. No-follow open is mandatory where the platform exposes it; unsupported platform capability remains explicit and the identity comparison still fails closed on observed substitution."
    - "Credential reads consume at most 4096 bytes with one-byte overflow detection, accept one non-whitespace value, are performed only for one transport request, and never cache, hash, persist, log, return, or include credential bytes or paths in diagnostics."
    - "Configuration, profile, manifest, evidence, runtime-status, startup-definition, argument-file, executable, book, and tablebase reads use the named finite limits above before allocation or streaming work proportional to arbitrary input. Large assets are hashed incrementally."
    - "A UCI child is admitted from one exact executable and bounded exact argument-file identity set. The provider revalidates those identities immediately before process creation and before qualification authority; any observed change terminates the new child and blocks its evidence."
    - "Publications use one random private exclusive temporary file in the proven destination directory, exact bounded writes, file synchronization when authoritative, atomic same-directory activation, parent synchronization where supported, target revalidation, and identity-safe cleanup that preserves the primary failure. Predictable pid-only temporary names are forbidden."
    - "Runtime logs use exact non-link append ownership and bounded rotation. Existing link/reparse targets or path substitution disable only log diagnostics and never interrupt an active game."
  failure:
    - "Missing, oversized, wrong-type, replaced, mutated, truncated, grown, unreadable, unclosable, or unpublishable authority files fail closed with bounded provider-owned diagnostics. Credential diagnostics never disclose the credential path."
    - "No check-then-read fallback, whole-binary materialization, implicit alternate file, or prior-path hash may become runtime or evidence authority."
  validation:
    - "Synthetic fixtures cover final-path and ancestor links, post-admission swap, same-size mutation, growth, truncation, one-byte overflow, directories and supported special files, read/write/close/sync/activation/cleanup failures, hostile target creation, and exact Windows/Linux identity behavior."
    - "Integrated tests prove malformed credential, configuration, profile, executable, argument, manifest, runtime-status, log, and startup paths fail before use while valid installed and package-local inputs retain their behavior."

capacity_profile:
  schemas: [uci_arena_lichess_capacity_profile_v1, uci_arena_lichess_capacity_profile_v2, uci_arena_lichess_standard_uci_capacity_profile_v1]
  required_bindings:
    - qualified
    - published_at
    - maximum_concurrency
    - engine_build_fingerprint
    - single_game_profile_sha256
    - model_fingerprint
    - provider_numeric_fingerprint
    - hardware_driver_fingerprint
    - evidence
  qualification: >
    Start and qualify the requested number of exact engine children concurrently,
    require the selected GPU provider and the complete telemetry contract for
    the profile-selected search core from every child, then close every child
    cleanly. Live MCGS profiles require MCGS graph, asynchronous inference,
    deadline-tail, root-coverage, and reservation-integrity telemetry; V2
    cursor fields have no MCGS authority. A smaller configured capacity may
    use a profile qualified at a greater capacity with identical bindings.
  child_cleanup:
    - "Fresh qualification returns evidence only after every exact owned UCI child has an observed zero-code, unsignalled exit and completed child stdio close without forced termination or cleanup failure. Legacy active-game close retains its existing best-effort shutdown policy; the additive continuous v2 path requires its native join plus strict child-close proof."
    - "Single-child and concurrent qualification preserve every primary startup/runtime rejection, including falsy or immutable reasons, and attach bounded cleanup diagnostics without mutating that reason. Cleanup continues for every acquired child even when another child fails."
    - "New capacity publication requires the actual per-child clean-close observation and retains it in evidence. Missing, rejected, nonzero, signalled, forced, or unobserved close blocks creation or replacement of the capacity artifact; retained historical profiles preserve their existing schema meanings."
  failure: "Missing, stale, mismatched, or undersized capacity evidence blocks live run before credentials are read."

single_game_profile_publication:
  schema: uci_arena_single_game_profile_v1
  owner: lichess_provider_profile_publisher
  rules:
    - "The stable evidence field names are compatibility keys; validation and publication select search-core-specific semantics from the qualified timing-profile identity."
    - "Publication consumes the immutable qualified uci_time_profile_v3 artifact, not an intermediate diagnostic attempt. The timing profile must bind the exact semantic timing/search contract, model, adapter, provider/runtime, hardware/driver, search topology, and at least thirty repetitions per declared case. Its executable digest remains provenance and may differ after a timing-compatible rebuild; the independent complete-game and single-game evidence still bind the exact current executable."
    - "MCGS publication requires the timing profile's complete MCGS graph-population, legal-root-coverage, asynchronous-overlap, single-owner, fallback, reservation-integrity, temporal-policy, and deadline-tail gates. V2 cursor counters cannot satisfy any MCGS gate."
    - "The complete-game artifact must bind the same executable, model, provider, topology, and search-core-specific runtime fields. MCGS requires positive graph, simulation, asynchronous-admission, and overlap evidence, complete legal-root seeding, and zero stale backups or leaked reservations. Executing tickets or asynchronous leases observed exactly at the bestmove boundary are telemetry, not leaks: the Engine-owned qualifier must report them as nonnegative bounded counters, complete its bounded post-bestmove drain, and prove final active tickets, active asynchronous leases, and stale publications are all zero before publication."
    - "The complete-game artifact must also prove that it validated and applied the same qualified timing-profile file and semantic identity before its timed diagnostic work. Publication verifies the exact provider, backup/emission, and forecast calibration values; an executable-only provenance difference does not revoke timing authority, while omitted, rejected, mismatched, or unapplied timing authority fails publication."
    - "MCGS graph size, Cpuct, outstanding-batch limit, and book-prior blend are copied from qualified identity rather than supplied independently by the operator."
    - "When complete-game evidence selects Syzygy, publication copies its exact external path, manifest path and file SHA-256, manifest identity/cardinality, probe limit and worker topology, rule-50 policy, and root/internal activation into the single-game profile. Publication revalidates the current manifest file before replacing the profile; absent tablebases remain an explicit no-tablebase qualification mode."
    - "Publication validates every input before replacing the profile and copies the exact timing profile plus complete-game artifact beside it; a rejected attempt leaves the prior authoritative profile unchanged."
    - "Historical V2-search-core profiles remain parseable evidence but cannot pass the live adapter's MCGS startup gate."


continuous_local_live_profile:
  schema: uci_arena_single_game_profile_v2
  qualification_scope: local_live_safety
  owner: lichess_provider_profile_publisher
  input_schema: uci_continuous_complete_game_diagnostic_v1
  authority:
    diagnostic: true
    timing: false
    strength: false
    performance: false
    release: false
    retention: false
  rules:
    - "Explicit schema dispatch preserves single-game v1, historical complete-game v3/v4 and immutable timing-profile v3 meanings. Unknown or missing continuous facts fail closed; this path never falls through to legacy drain/full-seeding acceptance."
    - "The exact current executable, literal arguments, working directory, model/provider/runtime/hardware identities, public tool source closure, advertised/applied UCI options, configured book/tablebase assets and qualified timing-profile file/identity are bound. Source closure membership follows the pinned Engine-owned public manifest; every declared public source byte is verified without Git execution or private imports. Run-declared source-clean/revision/tree provenance is retained, not independently authenticated by the consumer."
    - "The model owner's supported selected artifact and complete required relative asset declaration determine closure membership. Every required asset is present with its exact digest and the current child repeats the same declaration. DirectML does not imply selection of a packaged FP16 alternative. Public relative paths, physical containment and non-link identity are admitted before reads; credential/private aliases and trailing-dot/space Windows segments reject before any file operation."
    - "Completed evidence requires opposite-color natural-terminal games from startpos, legal replay, exact admitted position request/history, canonical raw-en-passant FEN and lossless current focus. The first supported canonical terminal transition is final. Every startup/model/opponent publication respects the producer-declared 500 ms ratio/grace bound independently of the IPC timeout."
    - "A publication may advance metadata sequence while retaining the admitted graph epoch, subject identity and position key. Its positive lossless UInt32 sequence cannot precede the earlier canonical observation; full candidate and any emitted native tuples match the actual publication tuple exactly. Search-derived publication requires an emitted native fence. Startup observation/publication retain exact tuple equality. The next accepted canonical model transition has a sequence strictly greater than that publication; an opponent transition is strictly greater than its previous canonical observation. No fixed +1 increment or globally coherent older observation is inferred."
    - "Every full legal candidate remains eligible, including unexpanded candidates. Actual root-policy and completed seed counts remain separate facts; partial seeds do not become complete seeding. Native publication is independently fenced to current focus or proves typed active non-search resolution. Book hints and tablebase constraints remain search-derived."
    - "Continuous game observations retain stable lineage, workers, evaluation service/fixed queue/cache lifetime and unchanged generation/capacities within one actual child game. Process-local identities are compared only within that child's timeline, never against another qualification child's numeric identities. A genuine ucinewgame clears the old baseline; the first actual admission/publication establishes the new baseline, including an opponent-only game before its first own publication."
    - "Bounded ongoing reservations/tickets/leases are live work, not leaks or grounds for publication-time global drain. Active final residue is unavailable; failure/stale-publication facts remain independently zero. Known individual cancellation/abandon counts do not alone assert broad cancellation or lifecycle failure. Aggregate actual asynchronous/provider work is required per diagnostic game."
    - "Actual native joined-search completion binds the ended lineage/epoch with failure false, zero reservation residue/stale backups/async leases and known tickets within their real capacity. It is separate from observed unsignalled zero process exit and completed stdio close without forced cleanup. Neither receipt nor process close asserts universal evaluator/provider destruction. V2 active-game close retains this strict owned proof."
    - "Startup applies and verifies the qualified timing context before its single bounded publication and candidate request. The public 1.3 historical searched-regime operation may preserve actual enabled book only for the owner's qualified false-book MCGS regime with configured/effective prior blend zero, exact Ponder and declared overhead envelope. It reports searched-regime authority separately from whole-runtime authority; actual options/knowledge are never relabelled false and the immutable profile/reserves/strategy remain unchanged."
    - "The pinned public timing SDK1.5 recognizes native temporal contracts v4 and v5 separately. A v3 timing profile authorizes only its captured native version; 4/5 mismatch, unknown or missing version fails closed. SDK compatibility alone grants no qualification or new timing, tuning, adaptive, strength or deployment authority."
    - "Opt-in continuous timing profile uci_time_profile_v4 requires the accepted public SDK1.5, native temporal contract5, the owner's complete repeated case population and distinct continuous gates. It is admitted only with single-game-v2 evidence. V3 historical gates/APIs and legacy-v1 publication remain v3-only. V4 uses either exact_runtime/uci_time_profile_runtime_status_v1 for a whole exact context or continuous_searched_regime/uci_time_profile_continuous_searched_regime_runtime_status_v1 for the explicitly projected searched context. Every actual timing application, publication revalidation and capacity child retains that exact declared schema/scope; mixed/unknown tuples fail closed."
    - "Actual game publications repeat applied timing, full option/declaration, model and knowledge activation, exact history/focus/candidate and owner-continuity validation before move submission. Scores remain optional; the Lichess server remains actual-game terminal authority."
  capacity:
    outer_schema: uci_arena_lichess_capacity_profile_v2
    evidence_schema: uci_arena_continuous_runtime_qualification_v1
    rules:
      - "The existing exact single-game profile hash binds the new inner semantics. Each requested concurrent child retains its actual OS process instance, legal bounded startup publication/full candidate evidence and actual native join plus clean exit/stdio proof. Missing or failed cleanup blocks publication/replacement. Stored legacy capacity meanings remain unchanged."
      - "Capacity process instances distinguish concurrently qualified children; future game children establish their own identity/baseline. Capacity never grants timing, strength, performance or release authority."

engine_adapters:
  selection: explicit_configuration
  standard_uci_v1:
    required_protocol:
      - "The child completes uci/uciok and isready/readyok within bounded time."
      - "Only options advertised by that child may be applied. Missing optional Ponder or Move Overhead disables the corresponding optimization rather than rejecting an otherwise conforming engine."
      - "A fresh start-position qualification search must return a syntactically valid and independently legal move before a slot may be admitted."
      - "The standard startup legal-move probe uses bounded go movetime 500 between games, with the existing qualification timeout and independent initial-position legality gate. It does not require or claim depth evidence, live allocation policy, strength or performance. Explicit fixedDepthProbe/smoke and extended qualification retain their separate depth-based contracts; live standard games continue to receive authoritative remaining clocks and increments."
      - "Clocked move search uses only standard position and go wtime/btime/winc/binc commands. Opponent-turn search uses standard go ponder when supported and otherwise remains disabled."
      - "Disabling optional opponent-turn go does not disable authoritative position delivery. After independent full-history legality acceptance and latest-observation validation, an idle child receives each changed own-move, opponent-move, reconnect/takeback, and terminal position without an extra go. A predicted or merely submitted move never becomes an accepted focus update."
      - "The UCI process owner retains at most one exact last-sent position, bound to its child and runtime generation, and suppresses the duplicate position preceding a same-root search. New game, child replacement, shutdown, or a superseded update invalidates this optimization; it is not independent game-state or native admission authority."
      - "A compatible running ponder keeps its admitted hypothesis through the own-move acknowledgement; the existing hit/miss and stale-output drain gates remain authoritative. A latest-state check is repeated after asynchronous drain before any accepted position write. Terminal focus is delivered after draining active publication and before the existing generation-owned slot release sends quit and closes the game child. Standard process closure never claims a GPU or provider join."
      - "Standard-UCI execution never requires runtime_status, MCGS telemetry, a model package, ONNX provider identity, a UCI Arena timing profile, or UCI Arena-owned option names."
    provenance:
      - "Every game binds executable SHA-256, normalized UCI id lines, advertised-option identity, applied options, and adapter identity. Model, provider, and UCI Arena timing fields remain explicitly absent rather than invented."
  uci_arena_extended_v1:
    required_protocol:
      - "The existing exact single-game, model, provider, MCGS, timing, capacity, opening-book, and tablebase gates remain authoritative."
      - "Opening-book publication remains independent of single-game search qualification so Book Forge may publish a newer conforming uci_arena_book_snapshot_v2 snapshot without regenerating timing evidence. When snapshot.manifest.json exists beside the canonical .bin/.stats/.policy set, the adapter independently validates the bounded manifest schema, generation, record count, exact artifact names and SHA-256 digests, then requires the Engine's activated snapshot identity, generation, manifest digest, policy digest, validation mode, entry count, and exact paths to match after restoring OwnBook and again after each ucinewgame before recording game provenance. A replacement that fails any check cannot displace the last qualified Engine process or enter completed-game evidence."
      - "If the on-disk live channel is replaced or becomes invalid after a manifest generation was independently validated, ucinewgame may continue only when every Engine-reported active snapshot and path field exactly matches that previously validated generation. Game provenance marks this retained_prior_valid_snapshot state; initial qualification and any changed or previously unvalidated identity still fail closed."
      - "A same-basename .stats and .policy pair without snapshot.manifest.json remains a rolling-compatible legacy file set: the adapter derives the configured book binary's expected FNV-1a identity from its bounded stats header and requires that exact loaded identity. With both sidecars absent, the Engine-owned base Polyglot capability remains usable and runtime identity is bound from the live Engine report without inventing Book Forge statistics, manifest authority, or hint authority."
      - "Installer composition for uci_arena_extended_v1 requires one regular non-link book binary. A same-basename .stats and .policy pair is optional but atomic: both valid regular non-link paths are supplied together or neither is supplied. A partial pair fails configuration, while an absent pair explicitly clears sidecar options instead of falling through to unrelated engine defaults."
      - "When a single-game profile binds Syzygy, runtime qualification requires exact active cardinality, manifest identity, probe limit and worker topology, rule-50 policy, and root/internal activation; retained files without a current matching profile and live runtime report have no installation or play authority."
      - "Profile-owned Syzygy path conflicts are decided from normalized absolute platform path identity, not raw separator, case, dot-segment, or trailing-separator spelling. A genuinely different tablebase or manifest still fails closed and content identity remains independently validated."
      - "Extended telemetry is validated only inside this adapter and never becomes a requirement of standard_uci_v1."
  substitution:
    - "Selecting standard_uci_v1 or uci_arena_extended_v1 changes adapter-owned qualification and telemetry validation only; Lichess streams, legality, challenge policy, persistence, slot admission, and move submission remain unchanged."
    - "Account probe and credential validation do not require an engine to be configured or qualified. Live run and startup registration do."
    - "The packaged UCI smoke delegates process launch, configured literal arguments, option validation, and qualification to the selected engine adapter; it never independently requires UCI Arena-only commands from standard_uci_v1."
  process_boundary:
    - "UCI option names and values are bounded single-line protocol values; configuration cannot inject additional UCI commands."
    - "Engine stdout protocol lines, retained identity lines, and projected stderr are bounded. Protocol overflow terminates the child and fails pending work."

protected_live_acceptance:
  capacity: {total_slots: 1, human_slots: 0, bot_slots: 1, bot_target_active: 0}
  runtime_bindings:
    - "The harness passes the installed engine executable, its immutable component root as working directory, the installed model root, and the shared Manager knowledge root explicitly."
    - "The harness may omit a calibrated time profile; conservative timing fallback remains visible and does not weaken exact engine/model/provider/single-game/capacity qualification."
  rules:
    - "Acceptance disables public inbound challenges and automatic scheduling and permits only the one explicitly named casual BOT opponent."
    - "Current target availability is proven by membership in the canonical api/bot/online NDJSON result. The public user profile supplies identity, BOT title, and disabled-account state but its optional online field is not authoritative."
    - "A capacity profile qualified for one exact child is sufficient because the protected harness cannot admit a second game."

slots:
  states: [empty, preparing, pending, active, draining]
  rules:
    - "A pending inbound acceptance or outbound challenge consumes exactly one audience slot."
    - "Prepare and qualify the UCI child before accepting or creating the challenge."
    - "An outbound timeout must cancel the still-live Lichess challenge before closing its child and releasing its slot. If cancellation races acceptance or fails, retain the pending slot and reconcile instead of allowing a late gameStart to overbook the pool."
    - "On confirmed decline, cancellation, preparation failure, or terminal game, close the child and release the slot exactly once."
    - "Concurrent timeout and terminal-event release attempts coalesce while the slot is draining; the slot cannot become empty or be reacquired until its owned engine has closed."
    - "Human and bot pools are hard partitions for challenge admission unless allow_borrowing is explicitly true. An already-started game recovered from Lichess may use any otherwise empty qualified slot after its native audience pool is exhausted; recovery never preempts an active game."
    - "Owner reservations claim the next human slot; while claimed, non-owner human challenges receive later."
    - "Public humans may use unreserved human slots; BOT-title challengers use only bot slots."
    - "On restart, establish the provider heartbeat/supervision loop before reconciling /api/account/playing. Scheduling and challenge admission remain disabled until reconciliation succeeds; transient API or network failure enters the same bounded reconnect/backoff lifecycle and never terminates the provider before supervision exists."
    - "After a global event-stream disconnect, reconnect with bounded exponential backoff and reconcile /api/account/playing before resuming scheduling so a gameStart event lost during the gap is recovered."
    - "Game admission is serialized by game id. Concurrent event-stream and reconciliation observations coalesce into one start, one child, one stream, and one slot generation."
    - "Every asynchronous slot transition and release is authorized by the generation captured when the slot was claimed; a stale callback can never mutate or release a later occupant."
    - "An outbound gameStart that races the challenge-create response adopts the already preparing opponent slot. The late create response may attach its challenge id but cannot move an active slot backward to pending or release its engine."
    - "A disconnected per-game stream reconnects and reconstructs position from authoritative gameFull/gameState moves without releasing its active slot."
    - "Repeated per-game stream failures retain the active slot and qualified child while retrying with bounded backoff. A retry-count threshold never converts an unfinished remote game into a local terminal session; only authoritative terminal state, a successful provider-requested zero-ply abort, or explicit whole-provider shutdown ends it."
    - "A typed local engine operation or move-contract failure is not a stream-transport failure. Quarantine publication for that game, record one bounded engine-child incident through the existing ledger, retain the active slot and current game stream, and continue canonical observations until authoritative completion or whole-provider shutdown. Duplicate states never retry the failed engine operation. Terminal authority resolves the game-scoped incident without claiming that the engine itself recovered."
    - "Quarantine preserves the exact canonical observation whose engine operation failed, including terminal gameFull initialization or gameState drain failure. Cross-game foreground coordination attributes a typed pause or resume failure only to the session owning that child; a healthy requesting session keeps its publication authority."
    - "An identical reconnect gameFull replay may refresh publication identity but is not transport-recovery progress. Only a changed authoritative root, status, or clock observation may reset exponential stream backoff; HTTP 429 retains the full effective cooldown."
    - "For a standard game where the bot is Black, the first authoritative started state with zero plies arms one first-move deadline. Reconnects do not extend that deadline; process recovery may start one fresh bounded deadline. Any authoritative move, terminal state, or provider shutdown cancels the pending request before dispatch."
    - "At expiry the provider revalidates zero plies immediately before dispatch and invokes the Bot API abort operation. HTTP 200 is authoritative aborted completion; HTTP 400 is a terminal abort refusal left for stream reconciliation; 429, transport, and 5xx failures use bounded cooldown-aware retry without concurrent abort requests. The provider never invokes this watchdog after one move or while playing White."

owner_control:
  storage: runtime_sqlite_only
  commands:
    - owner_add_remove_list
    - reserve_with_opponent_games_and_expiry
    - reservation_status_cancel
    - scheduler_status_pause_resume
  defaults: {reservation_games: 1, reservation_minutes: 15}
  rules:
    - "Owner identities are never committed in tracked configuration."
    - "Owner challenges and reservations have priority within the human pool but never preempt an active game."
    - "Reservations survive adapter restart and expire by UTC time."

opponent_scheduler:
  discovery: "GET /api/bot/online?nb=512 as NDJSON; webpage scraping is forbidden."
  selection_factors:
    positive: [rating_proximity, acceptance_probability, under_sampling, color_balance, freshness]
    negative: [recent_repetition, decline, timeout, cooldown]
  randomization: weighted_random
  rules:
    - "Never challenge self, an offline/stale candidate, a cooled-down opponent, or an opponent at its daily game cap."
    - "Create outbound challenges one request at a time, at least challenge_interval_seconds apart, until target_active is reserved by pending plus active bot slots. Version 8 requires a minimum configured spacing of 300 seconds; older configurations migrate upward instead of retaining an unsafe faster effective value."
    - "Game move submission has highest request priority, but no request class bypasses an active HTTP 429 cooldown."

storage:
  engine: node_sqlite
  journal_mode: WAL
  schema_version: 6
  tables: [schema_meta, owners, reservations, scheduler_control, opponents, challenge_attempts, games, game_archive_control, game_plies, api_safety_state, api_client_leases, provider_lifecycle_control, provider_incident_control, provider_incidents]
  invariants:
    - "Opening an existing schema-v3 or schema-v4 store idempotently materializes every required table. A superseded api_rate_limit singleton is imported as a conservative legacy-global safety row so a branch or adapter upgrade cannot erase or shorten an unexpired 429 cooldown. Schema-v5 adds durable challenge-create circuit fields without weakening imported global cooldown authority."
    - "The API-client lease persists the exact process-instance identity captured at acquisition. A replacement may take over a still-fresh lease only when an OS probe proves that exact instance is absent or the pid now names a different process; an exact live or unverifiable owner remains exclusive until normal expiry."
    - "Game id and challenge id ingestion are idempotent."
    - "Every game immutably binds opponent, color, time control, result, engine build, model id/fingerprint/checkpoint/adapter, provider/numeric/runtime/hardware identity, complete search and batching options, timing-profile identity and permissions, semantic timing-authority match, qualified-versus-current engine provenance comparison, and configured plus observed opening-book state."
    - "When AdaptiveCurveV1 is active, every game additionally binds the validated temporal-curve artifact revision, file sha256, evidence-manifest sha256, formula identity, and complete applied coefficient UCI options."
    - "The games row stores queryable core identity columns plus a versioned uci_arena_game_runtime_provenance_v1 JSON document and its sha256. The JSON includes the complete effective post-qualification UCI option map so later defaults cannot reinterpret a historical game; timing-profile provider, backup/emission, and forecast reserves must overwrite their pre-application defaults in both the option map and typed timing fields."
    - "Idempotent game-start replay may update opponent and clock metadata but never replaces runtime provenance for an existing game id. Legacy rows migrate without invented provenance and remain explicitly distinguishable by an empty provenance hash."
    - "Historical provenance may be backfilled only into blank provenance fields from an explicit, reviewable evidence manifest whose runtime identity is bound to an already-recorded game fingerprint and a bounded UTC interval. Backfill never overwrites non-empty identity, records evidence sources and unknown fields in the versioned JSON, is transactional, and reports matched, updated, skipped, and conflicting rows."
    - "Aggregates remain derivable from immutable game rows and separable by runtime identity."
    - "Startup reconciliation may fill missing terminal results without duplicating games."
    - "Reservation consumption is one SQLite transaction so a concurrent Manager cancellation or replacement cannot decrement or delete a different reservation."
    - "Persisting API safety state never shortens cooldown or replaces a newer strike observation with stale state."

transactional_game_activation_and_status_publication_2026_08_24:
  status: active
  owning_issue: https://github.com/iteathen/uci-arena-lichess-bot/issues/6
  activation_owner:
    owner: bot_controller_game_activation
    rules:
      - "The activation owner captures one exact slot generation before any transition and coordinates durable challenge acceptance, one-time reservation consumption, an activating game row, session construction, map publication, slot activation, execution, and cleanup."
      - "A pending/preparing slot may be adopted only when its challenge id exactly matches the authoritative game/challenge correlation id. Opponent identity or pending-slot cardinality alone has no adoption authority."
      - "The store transaction is idempotent by remote game id. Duplicate gameStart, reconnect, and startup reconciliation cannot consume a reservation twice or increment challenge acceptance twice."
      - "The session object and its observed execution task are published coherently before execution may begin. Slot active authority is published only after durable activation succeeds."
      - "A pre-publication failure removes only maps owned by that activation, marks the activating game with a bounded provider activation failure, releases only the captured slot generation, and closes its engine exactly once."
      - "Session failure is persisted as provider_error without fabricating a Lichess result. Cleanup failures are bounded and attached to the primary diagnostic; they never replace or hide the session failure."
      - "Cleanup is idempotent by activation generation and cannot release or close a later slot occupant."
  durable_sequence:
    transaction:
      - challenge_acceptance_transition_if_present
      - one_time_matching_reservation_consumption
      - idempotent_activating_game_row
    compensation:
      - bounded_activation_failure_state_on_the_same_game_identity
      - generation_owned_slot_and_engine_release
    later_game_full:
      - "Authoritative gameFull metadata and immutable runtime provenance fill only blank activating-row fields. Existing nonblank provenance is never replaced."
  status_publisher:
    owner: serialized_runtime_status_publisher
    projection_source: bounded_in_memory_owner_snapshots
    rules:
      - "Heartbeat scheduling performs no SQLite query, opponent aggregation, transport-sample traversal, JSON serialization, synchronous file write, or rename on the Lichess/game-clock event loop."
      - "The store maintains bounded cached control, opponent, and lease projections when their owning mutations commit. Transport sample/game counts and active game summaries are maintained incrementally."
      - "One unrefed worker owns JSON serialization and exact atomic runtime.json publication. Publications are serialized and newer pending generations coalesce; a stale writer can never activate after a newer writer."
      - "The worker uses the provider exact-file authority for a random private exclusive temporary file, bounded bytes, durable write, atomic same-directory activation, and identity-safe cleanup."
      - "A status failure never changes gameplay authority. The next successfully published projection includes one bounded status-publication blocker and the last successful generation/time."
      - "Initial and terminal status publication may be explicitly flushed; periodic and event-driven updates enqueue without delaying Lichess traffic. Shutdown drains the latest generation before terminating the worker."
  performance:
    - "Status scheduling records build time, activated write time, serialized byte count, coalesced generations, and failures without adding raw paths or output to runtime status."
    - "The event-loop and move-submit acceptance compares status enabled and disabled under the same bounded workload and rejects a material p95 or p99 regression."
  validation:
    - "Fixtures cover failure at durable activation, session construction, map publication, immediate session completion, primary plus cleanup failure, duplicate events, and simultaneous same-opponent challenges."
    - "Publisher fixtures cover overlap, coalescing, delayed completion, failure recovery, stale generation, temporary collision, write/activation failure, and shutdown drain."

sqlite_storage_foundation_2026_08_24:
  status: active
  owning_issue: https://github.com/iteathen/uci-arena-lichess-bot/issues/7
  owner: provider_lichess_storage_adapter
  path_authority:
    rules:
      - "The absolute UTF-8 database path is bounded before filesystem use. Every existing ancestor, the database, and any WAL or SHM sidecar is admitted through the provider exact-file authority and must be a regular non-link expected type."
      - "A missing database is activated from one random private exclusive empty file only when WAL and SHM are also absent. Orphan sidecars fail closed."
      - "Exact no-follow descriptor admission binds the database identity before SQLite open; the same database object and safe sidecar types are revalidated immediately after open, after migration, and around provider-owned multi-statement transactions."
      - "Node's built-in SQLite binding does not expose sqlite3_open_v2 flags and therefore cannot request SQLITE_OPEN_NOFOLLOW on SQLite's separate internal open. The exact-file no-follow admission plus immediate identity revalidation is the cross-platform authority; replacing it with a native binding is a separately reviewed packaging decision."
  connection:
    options:
      read_bigints: true
      timeout_ms: 5000
      foreign_keys: true
      double_quoted_string_literals: false
      extension_loading: false
      defensive: true
    effective_pragmas:
      journal_mode: wal
      synchronous: normal
      foreign_keys: 1
      busy_timeout_ms: 5000
      trusted_schema: false
    rules:
      - "Refusal of any required effective pragma is a typed initialization failure. The connection and any transaction are closed or rolled back before the failure escapes."
  migration:
    current_schema: 6
    rules:
      - "A valid empty SQLite database initializes in one exclusive transaction. A nonempty database must contain exactly one typed supported schema authority before any table creation or repair."
      - "Versions one through six are admitted only after exact table, column, primary-key, constraint, named-index, object-set, SQLite storage-class, boolean-domain, nonnegative-domain, and JavaScript-safe-integer verification for that historical version."
      - "Schema five admits exactly three known object sets: the historical base schema, base plus the exact provider_lifecycle_control extension, and base plus lifecycle plus the exact incident extension. Incident authority without lifecycle authority is malformed. Migration materializes any missing admitted extensions transactionally before advancing the base schema version."
      - "Migration to schema six preserves lifecycle and incident authority as required tables and transactionally adds the exact game archive control, game columns, ply table, indexes, and deterministic historical cursors."
      - "A schema-five provider restored after schema-six staging may write only the exact archive-column defaults added for compatibility. On the next schema-six open, the store transactionally assigns missing archive cursors and classifies exact terminal default rows as summary_only with historical_moves_unavailable; the repair is idempotent, requires no ply rows or partial archive identity, and every other malformed current-schema row remains rejected."
      - "The prior ALTER migrations' append-order layouts for the schema-four lease identity column and schema-five challenge-safety columns, plus the corresponding fresh-create layouts, are the only admitted column-order variants. Arbitrary column reordering remains malformed."
      - "Known version-two legacy rate-limit authority is a named migration variant. Unknown, missing, duplicate, partial, malformed, or ambiguous authority is rejected rather than repaired."
      - "Every migration step and final quick_check executes inside the same exclusive transaction. Failure rolls back all DDL and data changes, closes the connection, and leaves deterministic retry authority."
      - "The final schema_meta table is one STRICT singleton keyed by id=1 with one positive INTEGER version. Historical loose metadata is rebuilt only after its exact single row has been admitted."
  typed_values:
    rules:
      - "Every persisted integer column must use SQLite INTEGER storage, remain nonnegative and within the JavaScript safe-integer domain, and satisfy any narrower boolean or domain bound before migration or projection."
      - "The connection reads integers as BigInt. One typed projection owner converts only safe BigInt values to Number; strings, reals, negative values, overflow, unsafe BigInt values, and fallback coercion never become domain authority."
      - "Caller-supplied counts, durations, timestamps, PIDs, clocks, topology values, limits, and plies require exact finite safe integers with explicit bounds. Numeric strings and reals are rejected."
  transactions:
    - "Reservation consumption, challenge state plus counters/cooldown, API lease acquisition, online-opponent replacement, game activation, and provider lifecycle gate/work mutations use the provider immediate-transaction owner with exact pre/post path authority and rollback that preserves the primary error."
    - "If rollback or the required post-rollback path revalidation also fails, the boundary returns LICHESS_STORAGE_OPERATION_AND_RECOVERY_FAILED with a bounded path-free detail and retains the primary operation error as its cause."
    - "Historical backfill uses the same exact pre/post authority while retaining its intentional dry-run rollback contract."
  validation:
    - "Fixtures cover database/ancestor/WAL/SHM link and type failures where the host exposes them, orphan sidecars, valid empty initialization, unversioned nonempty storage, duplicate/unknown/wrong-type authority, partial schema, exact lifecycle-extension migration and rejection, wrong storage classes, negative and unsafe integers, pragma refusal, injected migration failure and retry, abrupt process exit rollback, and WAL reopening."

provider_incident_ledger_2026_08_24:
  status: active
  owning_issue: https://github.com/iteathen/uci-arena-lichess-bot/issues/41
  owner: provider_runtime_store_and_incident_projection
  purpose: >
    Retain bounded sanitized provider failure episodes and expose typed pages
    and active summaries without transferring provider storage or diagnostic
    interpretation to Manager.
  lego_boundary:
    provided_ports:
      - incidents_list_v1
      - status_v4_active_incident_summary
    rules:
      - "The provider owns incident classification, sanitization, aggregation, resolution, retention, pagination, and SQLite mutation. Manager invokes the declared operation and presents closed fields without opening provider storage or interpreting logs."
      - "Raw NDJSON, SQLite rows, startup files, response bodies, engine output, and provider-private paths never become Manager inputs. Installer has no incident operation or storage role."
      - "The incident domain module validates bounded project-owned values; the store adapter alone owns SQL and transactions; API, scheduler, stream, startup, engine-child, storage, and status-publication owners report through that port without importing one another's internals."
  storage:
    schema_base: 5
    compatible_extension_tables:
      - provider_incident_control
      - provider_incidents
    migration:
      - "The exact incident extension is added transactionally after the existing lifecycle extension while retaining schema base 5. Base-only, base-plus-lifecycle, and base-plus-lifecycle-plus-incidents are the only admitted version-five object sets; incidents without lifecycle authority are malformed."
      - "The final store requires both compatible extensions. Existing scheduler, game, challenge, cooldown, lease, lifecycle, and provenance rows are preserved."
    control_fields:
      - next_cursor
      - last_truncated_cursor
      - truncated_rows
      - truncated_active_rows
      - updated_at
    incident_fields:
      - immutable_cursor
      - private_stable_identity_sha256
      - provider_owned_code
      - severity
      - source
      - operation
      - first_occurrence
      - last_occurrence
      - occurrence_count
      - active_or_resolved
      - resolved_at
      - optional_http_status
      - optional_retry_deadline
      - optional_remote_game_id
      - sanitized_detail
    rules:
      - "One immediate transaction allocates a strictly increasing JavaScript-safe cursor, inserts or aggregates one active stable identity, preserves the earliest occurrence, advances the latest occurrence and retry deadline monotonically, and applies retention."
      - "A resolved identity receives a new cursor when a later failure episode begins. Exact startup-exit receipt identity is an idempotent episode scope so re-reading one unchanged receipt never creates or increments an incident."
      - "Resolution is durable and never deletes or rewrites a cursor. An absent active identity resolves idempotently without inventing history."
  stable_identity:
    fields: [code, source, operation, optional_http_status, optional_remote_game_id, optional_episode_scope]
    excluded: [detail, severity, occurrence_time, retry_deadline]
    rules:
      - "Identity is one provider-owned canonical JSON tuple hashed with SHA-256. Arbitrary detail cannot create notification storms."
      - "Severity may only remain or escalate while an episode is active. Count increments once per admitted occurrence and duplicate idempotent startup evidence does not increment it."
  retention:
    maximum_rows: 2048
    resolved_retention_ms: 7776000000
    maximum_page_size: 100
    rules:
      - "Resolved rows older than ninety days are removed on provider maintenance. If the hard row cap is exceeded, oldest resolved rows are removed before oldest active rows."
      - "Every deletion advances last_truncated_cursor and cumulative truncated_rows; removal of active rows additionally advances truncated_active_rows. Public pages and status expose truncation so absence is never presented as complete history."
      - "Retention never changes cooldown, scheduler, lifecycle, game, startup, or API authority."
  sanitization:
    detail_maximum_characters: 512
    rules:
      - "Code, source, operation, severity, HTTP status, retry deadline, game id, occurrence time, and optional episode scope are closed and bounded before persistence. Numeric strings and non-integer timestamps are rejected."
      - "Details become one whitespace-normalized line. Oversized input, credential/header markers, bearer-like values, path forms, command-line material, arbitrary JSON documents, and raw engine protocol output are rejected before SQL."
      - "Call sites author safe summaries from typed facts. A rejected incident report is a bounded private diagnostic and never replaces the primary provider failure or interrupts gameplay."
  recording:
    covered:
      - api_rate_limit_entry_and_recovery
      - permanent_api_error
      - scheduler_fault_and_recovery
      - global_and_game_stream_disconnect_and_recovery
      - unexpected_startup_exit_and_ready_recovery
      - engine_child_or_game_session_failure
      - storage_operation_failure
      - status_publication_failure_and_recovery
    rules:
      - "Failure-path recording may perform one bounded provider-store transaction. Normal runtime-status heartbeat construction performs no incident query or SQLite scan."
      - "HTTP 429 incidents copy the already-persisted provider cooldown deadline and resolution never clears, shortens, bypasses, or rewrites API safety state."
      - "Status-publication recording runs only after a worker failure or recovery outcome; it cannot recursively publish status or change game authority."
      - "Unexpected startup exit evidence is recorded before credential access and resolved only after the replacement provider reaches ready authority. Clean exit evidence creates no crash incident."
  public_contract:
    service_contract_minor: "1.1"
    operation: incidents_list
    arguments:
      - filter_active_or_all
      - after_cursor
      - limit
    response_schema: uci_arena_provider_incident_page_v1
    page_fields:
      - filter
      - after_cursor
      - next_cursor
      - has_more
      - incidents
      - retention
    rules:
      - "Rows are ordered by immutable cursor ascending and fetched with cursor greater than after_cursor. New inserts cannot duplicate or reorder prior rows."
      - "The closed item projection includes cursor, code, severity, source, operation, first/last occurrence, count, state, resolved_at, optional HTTP status/retry deadline/game id, and safe detail. Private identity hashes are never returned."
      - "The CLI command prefix and entrypoint come from the provider component and operation contracts; a substituted Manager never hard-codes Node, a provider path, or SQLite knowledge."
  status_v4:
    schema: uci_arena_lichess_status_v4
    additions:
      - closed_supervision_projection
      - closed_active_incident_summary
    incident_summary_fields:
      - available
      - active_count
      - highest_severity
      - latest_cursor
      - truncated
      - truncated_rows
    compatibility:
      - "Provider status v4 replaces the provider's published current status schema only with the declared additive fields. Manager remains responsible for accepting conforming v3 providers and marking incidents unavailable when v1.1 operations are absent."
  errors:
    - "Invalid public pagination input fails before opening a credential or returning a partial page. Unknown filters and cursors outside the safe-integer domain are rejected."
    - "Storage-unavailable status returns incidents.available false and one bounded blocker; it never opens logs or fabricates an empty authoritative ledger."
  validation:
    - "Fixtures cover HTTP 400/429 and malformed error detail, cooldown and quarantine recovery, scheduler faults, global and game stream failures, startup exit idempotency, engine-child/game failure, storage failure, and status-publication failure/recovery."
    - "Aggregation, escalation, resolution, new episodes, ninety-day pruning, hard-cap pruning, active-row truncation, and cursor pages are deterministic under concurrent inserts."
    - "Oversized, multiline, path-bearing, header-bearing, credential-like, JSON-document, and engine-protocol details never persist or project."
    - "A fake Manager resolves the dependency runtime plus provider CLI entrypoint and invokes incidents_list through the declared command prefix."

provider_game_archive_2026_08_24:
  status: active
  owning_issue: https://github.com/iteathen/uci-arena-lichess-bot/issues/42
  owner: provider_game_domain_and_runtime_store
  purpose: >
    Retain one canonical operational record for every provider game and expose
    bounded live, history, and replay projections without transferring storage,
    legality reconstruction, or provenance interpretation to Manager.
  lego_boundary:
    provided_ports:
      - games_list_v1
      - game_get_v1
      - status_v5_archive_summary
    rules:
      - "The provider game-domain module owns closed game identifiers, canonical replay validation, FEN snapshots, archive content identity, provenance projection, and public DTO validation. The provider store adapter alone owns SQLite schema, migration, transactions, cursors, and queries."
      - "Live stream and historical-export adapters submit typed observations through the same game-domain/store port. They never expose transport responses or create a parallel game archive."
      - "Manager invokes only receipt-declared games_list and game_get operations and renders their closed records. Manager never opens matches.sqlite, runtime files, logs, component paths, raw engine output, or Lichess response documents."
      - "Installer composes optional component-manifest bindings and preserves the provider workspace. It never interprets games, plies, archive completeness, or provenance. Training export remains reserved and has no runtime authority."
  storage:
    migration:
      from_schema: 5
      to_schema: 6
