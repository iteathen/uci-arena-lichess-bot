      rules:
        - "Migration admits the exact schema-five base plus lifecycle and incident extensions, preserves every existing row, adds archive columns and tables, assigns immutable deterministic archive cursors to all known games, and assigns completion cursors to existing terminal rows ordered by finished time and game id."
        - "Existing terminal summaries become summary_only with no invented moves, positions, component versions, or archive hash. Existing unfinished rows become live and retain completion cursor zero."
        - "Failure rolls back the schema version, columns, tables, indexes, cursor allocation, and row changes as one transaction."
    control:
      table: game_archive_control
      fields: [next_archive_cursor, next_completion_cursor, updated_at]
    games_additions:
      - immutable_archive_cursor
      - immutable_completion_cursor
      - canonical_initial_fen
      - variant
      - archive_completeness
      - bounded_incomplete_reason
      - archive_content_sha256
      - provider_component_id
      - provider_component_version
      - provider_component_manifest_sha256
      - optional_engine_component_id
      - optional_engine_component_version
      - optional_engine_component_manifest_sha256
      - backfill_attempt_count_and_time
    game_plies:
      primary_key: [game_id, zero_based_ply]
      fields: [uci_move, before_fen, after_fen, actor_color, optional_actor_clock_ms]
      maximum_plies: 2048
    rules:
      - "One immediate transaction allocates each game/archive cursor. Completion allocates one strictly increasing completion cursor and atomically commits terminal metadata plus the SHA-256 identity of the complete canonical replay."
      - "Streamed positions reconcile idempotently by game id and zero-based ply. Append and exact duplicate observations preserve existing plies; a takeback may replace only the suffix of a nonterminal line."
      - "After completion cursor allocation, terminal metadata, initial FEN, canonical plies, clocks, archive completeness, component identities, and content identity are immutable. Exact terminal replay is idempotent; any conflict fails closed."
      - "A live observation records a clock only for the exact final observed actor when Lichess supplied that typed clock. Missing intermediate reconnect clocks remain absent and are never derived."
  provenance:
    provider:
      - "Every newly initialized game binds the packaged provider component id, component version, and exact product component-manifest SHA-256."
    engine:
      - "A selected engine binds component id, version, and manifest SHA-256 only when an explicit public component-manifest path is supplied and its exact non-link file inventory contains the exact selected executable with matching size and SHA-256."
      - "A standard or otherwise external UCI executable without that binding retains its executable/build and normalized UCI identity in runtime provenance while public component identity is null. Historical versions are never inferred from the current installation."
    public_projection:
      - "Public provenance is an allowlisted path-free projection of immutable game/runtime identities. Raw UCI id lines, applied command arguments, paths, environment, logs, and arbitrary provenance JSON never cross the Manager boundary."
  historical_backfill:
    owner: provider_archive_backfill_loop
    source: existing_api_safety_coordinator
    export_by_ids_maximum: 300
    maximum_admitted_response_bytes: 16777216
    request_priority: below_discovery
    requested_evidence: [moves, clocks]
    rules:
      - "The background owner requests summary_only game ids plus legacy unresolved live rows in bounded batches, excludes every currently active or starting game, never runs before startup reconciliation, and uses the existing one-request-at-a-time cooldown authority with evaluations, opening, and literate annotations disabled. An exact terminal export may promote a legacy live row; otherwise that row remains live without an invented finish."
      - "The bounded provider-owned parser admits standard-variant export records, replays at most 2,048 SAN moves through the existing chess legality implementation, and emits canonical UCI plus before/after six-field FEN snapshots."
      - "A successful exact match becomes reconciled and immutable. Missing, malformed, illegal, unsupported, or conflicting history remains summary_only with a closed reason and attempt evidence; runtime provenance and historical component versions are never rewritten."
      - "Transport or cooldown failure leaves the batch unattempted for retry. Backfill work is separately scheduled and never blocks the event-stream, reconciliation, scheduler, or status loops on local parsing or SQLite scans."
  retention:
    games: indefinite_in_v1
    automatic_pruning: forbidden
    summary_fields: [total_games, complete_games, incomplete_games, live_games, logical_storage_bytes]
  public_contract:
    service_contract_minor: "1.1"
    operations:
      games_list:
        arguments: [scope_live_or_history, before_cursor, limit]
        maximum_page_size: 100
        response_schema: uci_arena_provider_game_page_v1
      game_get:
        arguments: [game_id]
        response_schema: uci_arena_provider_game_v1
        maximum_plies: 2048
    rules:
      - "History uses immutable completion cursor descending; live uses immutable archive cursor descending. The page returns rows strictly before the requested cursor and fetches limit plus one, so new games cannot duplicate or skip previously observed history."
      - "The game detail record includes bounded metadata, truthfully nullable component identities, archive completeness, content identity, allowlisted runtime provenance, and provider-authored replay snapshots with canonical white-or-black actor color. Manager may derive local-versus-remote only when the recorded bot color is present."
      - "Invalid scope, cursor, limit, or game id fails before storage creation. Read-only operations refuse missing storage instead of creating a new authority."
  status_v5:
    schema: uci_arena_lichess_status_v5
    additions: [archive_available, total, complete, incomplete, storage_bytes]
    compatibility:
      - "Status v5 preserves every status-v4 supervision and incident field and extends only the closed games projection. Manager remains responsible for accepting conforming v3 and v4 providers and treating archive operations as unavailable when capabilities or declared operations are absent."
  validation:
    - "Migration fixtures prove deterministic cursor assignment, preservation of every version-five row and incident/lifecycle authority, exact schema/index admission, rollback, and retry."
    - "Compatibility fixtures prove exact default-shaped archive rows written by a restored schema-five provider heal transactionally and idempotently, while non-default malformed archive authority still fails closed."
    - "Crash, reconnect, duplicate gameFull/gameState, clock correction, stream gap, takeback, and startup-reconciliation fixtures produce one canonical nonterminal line and one immutable terminal replay."
    - "Bounded historical exports prove SAN-to-UCI/FEN reconstruction, optional clocks, unavailable/malformed/conflicting records, cooldown preservation, no evaluation request, and at most 300 ids per batch."
    - "At 646 or more records, stable keyset pages reach every history row exactly once without returning a full-store response. Game detail never exceeds 2,048 plies."
    - "Substitution fixtures cover an external standard UCI executable with null component identity and an explicitly bound installed engine manifest whose exact executable inventory is validated."
    - "Schemas and adversarial projections prove no credential, token path, component/runtime path, command, header, raw response, SQLite row, raw engine output, or arbitrary provenance JSON crosses the boundary."

planned_provider_resilience_and_incidents_2026_08_23:
  status: superseded_by_active_supervision_and_incident_contracts
  suite_record: https://github.com/iteathen/uci-arena-installer/issues/166
  owning_issues:
    supervision: https://github.com/iteathen/uci-arena-lichess-bot/issues/40
    incidents: https://github.com/iteathen/uci-arena-lichess-bot/issues/41
  activation:
    - "This section retains the approved planning record. Runtime supervision authority is provider_exit_supervision_contract_2026_08_23; runtime incident authority is provider_incident_ledger_2026_08_24."
  startup_authority:
    rules:
      - "Each platform retains exactly one provider-owned startup authority. Manager and Installer never add a second daemon supervisor."
      - "Linux retains Restart=on-failure with a sixty-second restart delay."
      - "Windows retains one hidden least-privilege logon task and IgnoreNew, and adds an indefinite one-minute repetition to the logon trigger so an unexpected exit is retried without admitting a concurrent duplicate."
      - "A clean expected shutdown is not restart-eligible and never produces a crash incident or restart loop."
  exit_receipt:
    owner: provider_native_launcher
    publication: bounded_exact_file_atomic_replacement
    fields:
      - process_instance_identity
      - started_at
      - exited_at
      - child_exit_code
      - expected_clean_or_unexpected_disposition
      - restart_eligible
    forbidden:
      - command_lines
      - executable_or_working_directory_paths
      - arguments_or_environment
      - credentials_or_headers
      - raw_child_output
    rules:
      - "The receipt binds the exact supervised child instance and survives abrupt child termination so later status and incident reconciliation can explain the exit."
      - "Publication is bounded and atomic; an invalid or stale receipt has no process-liveness authority."
  incident_ledger:
    prerequisite: "Provider issue 7 storage hardening and migration authority must land first."
    owner: provider_runtime_store
    retention: bounded_aggregated_ledger
    stable_fields:
      - provider_owned_code
      - first_occurrence
      - last_occurrence
      - count
      - severity
      - active_or_resolved
      - operation
      - optional_http_status
      - optional_retry_deadline
      - optional_game_id
      - sanitized_detail_maximum_512_characters
    covered_failures:
      - api
      - scheduler
      - stream
      - startup
      - engine_child
      - storage
      - status_publication
    rules:
      - "Repeated events aggregate by one stable provider-owned code without losing first/last occurrence, count, severity, and recovery state."
      - "Sanitization rejects credentials, headers, command lines, paths, raw output, and arbitrary response documents before persistence or publication."
      - "HTTP 429 and retry incidents expose the provider-owned cooldown deadline but recovery never clears, shortens, or bypasses it."
  planned_contract:
    service_contract_minor: "v1.1 additive incidents_list operation"
    status_schema: "uci_arena_lichess_status_v4 adds supervision and active-incident summaries"
    compatibility: "Manager continues accepting current status v3 and marks incident features unavailable when the declared operations are absent."
    paging: "Stable provider-owned keyset cursor; bounded page and response schemas are defined by the implementation PR."
  validation:
    - "Unexpected Windows and Linux exits restart within two minutes, never produce duplicate authorities, and remain visible after recovery."
    - "Clean shutdown neither produces a crash incident nor restarts."
    - "HTTP 400 and 429, cooldown recovery, scheduler faults, stream failures, malformed error bodies, startup failures, engine-child failures, storage failures, and status-publication failures create bounded sanitized incidents."
    - "Provider issue 31 remains closed; the new projection exposes its existing rate-limit authority and never reimplements or weakens cooldown behavior."
    - "No fixture, receipt, incident, status, log, or diagnostic reads or exposes credential contents."

planned_operational_game_archive_2026_08_23:
