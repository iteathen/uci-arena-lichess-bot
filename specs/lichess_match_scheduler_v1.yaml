future_game_archive_and_training_export_2026_08_09:
  status: training_export_reserved_operational_archive_active_elsewhere
  purpose: >
    Reserve optional Restaurant training export derived from the provider-owned
    canonical archive without reading matches.sqlite or inventing a second
    game-capture path. The operational archive and Manager history/replay authority
    are active under provider_game_archive_2026_08_24; this section grants no
    training authority.
  activation:
    - "This section reserves a training-export compatibility contract only. It does not enable export or training ingestion in the current provider."
    - "The operational archive above is runtime authority. This section grants no training-export runtime behavior, cursor, schema, or publication authority."
    - "Implementation requires a later explicit spec-first change, bounded storage policy, contract schemas, migration behavior, tests, and operator-visible controls."
  ownership:
    provider:
      - canonical streamed game and move-sequence capture
      - immutable completed-game archive records
      - export cursor, segmentation, compression, checksums, and deduplication
      - redaction or pseudonymization selected by the export policy
    manager:
      - bounded live-game, game-history, replay, and export-status projections through declared typed provider operations
    restaurant:
      - source eligibility, sampling, weighting, optional reanalysis, feature and target construction, CCR materialization, and dataset lineage
    forbidden:
      - "Manager or Restaurant opening provider SQLite, logs, or runtime-private files directly."
      - "The provider emitting CCR rows or importing Restaurant source, model, feature, or training types."
      - "Installer interpreting game, evaluation, model, or training semantics."
  canonical_capture:
    rules:
      - "One provider-owned canonical game record is the source for future live-game projection, completed-game history/replay, and training export; UI-specific DTOs and export-specific recapture are derived views, not competing authorities."
      - "Remote game id plus canonical move sequence is the idempotency key. Reconnect, gameFull replay, and startup reconciliation may complete the same record but never create a second logical game."
      - "A game becomes export-eligible only after an authoritative terminal state. In-progress, abandoned-local, or transport-failed sessions remain nonterminal operational records until Lichess supplies terminal truth."
      - "The archive retains the initial position, complete legal UCI move sequence, result, termination, variant, rated state, time control, per-ply clocks when supplied, color assignment, and the immutable engine/runtime provenance already bound to the game row."
      - "Search observations are optional per-ply evidence. Missing observations remain absent and are never reconstructed from a later engine default or fabricated from the game result."
  export_bundle:
    schema: uci_arena_lichess_training_export_v1
    media_type: application/vnd.uci-arena.lichess-training-export.v1
    compression: zstandard
    logical_members:
      manifest: manifest.json
      games: games.pgn.zst
      positions: positions.jsonl.zst
    rules:
      - "Each bundle covers a bounded UTC or byte-size segment, is immutable after publication, and is named or indexed by content identity. New games create new bundles; an existing bundle is never appended in place."
      - "manifest.json binds schema major, provider component identity, export-policy identity, source time/id range, record and game counts, logical member names, uncompressed and compressed byte counts, and SHA-256 for every compressed member."
      - "games.pgn.zst contains complete terminal games for replay and ecosystem interoperability. positions.jsonl.zst contains one UTF-8 JSON object per line for streaming ingestion without full decompression to disk."
      - "A durable provider-owned cursor and remote-game-id/content-hash ledger make retry idempotent. Cursor advancement occurs only after every member and manifest is fsynced, hashed, validated, and atomically published."
      - "A corrupt, partial, unsupported-major, digest-mismatched, or count-mismatched bundle is non-authoritative and must not advance the export cursor."
  position_stream:
    compatibility_goal: lichess_db_eval_jsonl_zst_envelope
    authoritative_reference: https://database.lichess.org/#evals
    record_boundary: one_pre_move_position_per_played_ply
    top_level_fields:
      required:
        - fen
        - arena
      optional:
        - evals
    rules:
      - "fen uses the four-field Lichess evaluation-stream shape for reader compatibility. arena.full_fen retains the six-field rule state used for canonical replay."
      - "evals is emitted only when its depth, knodes, PV, cp, and mate fields have genuine Lichess-compatible engine-analysis semantics. Game outcomes, MCGS simulations, model logits, and visit counts must never masquerade as eval depth, knodes, cp, mate, or PV evidence."
      - "Provider-specific information is confined to the versioned arena namespace so a generic Lichess evaluation reader may ignore it. Unknown additive arena fields are ignorable within one major; an unknown major fails closed for Arena-aware consumers."
    arena_required_fields:
      - schema
      - remote_game_id
      - ply_index
      - full_fen
      - played_move_uci
      - actor
      - result
      - termination
      - engine_adapter
      - runtime_provenance_sha256
    field_semantics:
      ply_index: zero_based_index_of_played_move
      full_fen: six_field_position_before_played_move
      played_move_uci: canonical_legal_move_applied_from_full_fen
      actor: local_engine_or_remote_opponent
      result:
        perspective: white
        values: ["1-0", "0-1", "1/2-1/2"]
      runtime_provenance_sha256: immutable_game_runtime_provenance_identity
    optional_fields:
      - clocks_before_move
      - remote_game_url
      - local_engine_search
      - source_account_pseudonym
      - opponent_pseudonym
    local_engine_search:
      rules:
        - "Search data is present only when captured from the exact local engine decision for this ply and binds its search/evaluation generation."
        - "Perspective is explicit and defaults to side_to_move only when declared; consumers never infer perspective from sign or actor."
        - "MCGS evidence uses typed simulations, WDL/value, proof state, and sparse legal-move policy or visit entries. It never uses depth or knodes as aliases."
        - "Sparse entries use canonical UCI moves and numeric weights/counts. A dense model-width vector such as 1858 or 4162 is not part of this provider boundary; Restaurant's selected model adapter owns policy-index mapping."
  privacy_and_reuse_gate:
    rules:
      - "Operational game history may retain the account identifiers needed for provider behavior, but a training export pseudonymizes or removes user names by default and never includes credentials, token paths, chat, private messages, request headers, IP data, or raw logs."
      - "The export manifest records the applied redaction policy and whether remote account identifiers remain."
      - "Future training reuse requires an explicit operator-approved policy covering applicable Lichess terms, licenses, privacy, retention, deletion, and redistribution. This contract makes no legal conclusion and grants no automatic training authority."
      - "Engine/model provenance and actor remain distinguishable after redaction so Restaurant can prevent self-label feedback loops and report source composition truthfully."
  future_validation:
    - "Reconnect, reconciliation, and duplicate gameStart fixtures produce one canonical completed game and byte-identical logical exports."
    - "PGN replay and every positions record reconstruct the same legal move sequence, six-field rule state, result, and termination."
    - "Streaming readers verify bounded lines, Zstandard integrity, member digests, counts, cursor crash recovery, and no full-archive temporary decompression."
    - "Fixtures prove missing analysis remains absent, genuine evals retain Lichess semantics, and MCGS/search extensions cannot be mistaken for evals."
    - "Manager projections and training exports derive from the same canonical game identity without Manager or Restaurant reading provider-private storage."
    - "Privacy fixtures prove default pseudonymization and absence of credentials, headers, chat, logs, token paths, and unrelated provider state."

windows_supervision:
  task_name: UCI Arena Lichess Adapter
  installed_launcher: native/lichess_adapter_launcher.exe
  development_build_output: native/build/Release/lichess_adapter_launcher.exe
  rules:
    - "The registered logon task is hidden, least-privilege, single-instance, network-gated, unlimited-duration, and restarted after failure."
    - "The task starts a Windows GUI-subsystem launcher; the launcher creates the foreground Node adapter with CREATE_NO_WINDOW and supervises it in a kill-on-close job."
    - "The Node adapter remains the foreground child of the launcher so Task Scheduler observes its real exit code; no detached intermediate process is permitted."
    - "The adapter writes runtime_state/lichess/adapter.ndjson and runtime.json because supervised stdout and stderr are intentionally attached to NUL."
    - "Startup registration may persist only the token-file path, never token contents, and must validate engine/capacity evidence before registration."
    - "Uninstall first disables restart, then invokes the staged native supervisor to terminate and wait for every process in the exact receipt-owned launcher tree. It additionally polls Task Scheduler until the GUI launcher is no longer running. Only after both proofs may it delete the task and startup evidence."
    - "A missing task is idempotent success. Access denial, an unknown task state, or failure to reach stopped and deleted states within the bounded deadline fails closed and preserves the provider payload for retry."
    - "Startup-control v3 exposes typed credential-free pre_replace and post_replace operations. An absent registration or an explicitly disabled inactive registration remains inactive across an exact-root replacement, and post_replace reports safe_inactive without reading credentials or starting the provider. Retry retains the original operator startup intent; a different unfinished replacement or unmatched completion fails closed. Before any receipt-owned dependency root can change, the staged provider first closes the provider-owned transactional admission gate and proves zero active or unresolved provider work; only then does it disable restart, terminate and wait for the exact prior launcher process tree, retarget the existing startup definition from the exact receipt-owned root to the exact replacement root without reading credential contents, and leave it disabled until the installed replacement explicitly resumes it."
    - "Pre-replacement rewrites only validated component-root references, preserves the external token-file path and other arguments, and requires a stopped disabled task before payload replacement. Linux applies the equivalent bounded rewrite to the user unit. Before explicit post-replacement resume, the provider validates current configuration and exact single-game, timing, temporal-curve, capacity, model, book, and tablebase authorities, then rebuilds every non-secret task or unit argument from those current bindings. Only the existing external token-file path and expected account are preserved from the disabled registration; an unknown action shape or any missing/current-evidence mismatch fails before enablement. Post-replacement normally proves the provider remains active and ready throughout a bounded stability window. Because the declared post-replacement contract does not require immediate live readiness, it may instead accept a fresh current-process starting publication only when the task is active, the API lease is authoritative, scheduler fault is null, and every blocker is provider_starting or startup_reconciliation_pending; the lifecycle result remains providerReady false and explicitly reports startupPending true while supervision continues exact qualification. A stale, conflicting, inactive, faulted, or otherwise blocked starting projection remains fatal. When credential-free validation proves the selected single-game profile, model/checkpoint, search topology, tablebase, and temporal-curve authorities still match and only the exact Engine executable fingerprint differs, startup instead leaves the retargeted registration disabled and returns installed true, active false, and requalificationRequired true with a closed reason code. Installed requalification must then prove that the selected timing profile remains semantically compatible before it can publish exact replacement evidence or enable the provider. Other configuration, model, timing, book, tablebase, capacity, task-control, or readiness failures remain fatal."
    - "A fresh active replacement that owns the authoritative local API lease and is intentionally waiting for an unexpired durable global API cooldown is stable replacement authority even though providerReady remains false. Post-replacement reports the cooldown deferral explicitly, never clears or shortens the cooldown, and continues supervised startup; stale status, reconciliation, a lease conflict, scheduler failure, or an ordinary disconnected stream remains fatal."
    - "Installed qualification is permitted while that exact retargeted startup registration is explicitly disabled and inactive; an enabled, active, or ambiguously reported registration still blocks qualification. Successful qualification does not silently start the provider: the new exact single-game and capacity outputs must enter through Installer locators and configuration reconciliation before explicit post-replacement resume."
    - "Task Scheduler and systemd command lines are derived deployment projections, never evidence or configuration authority. Post-requalification reconciliation replaces stale engine, model, single-game, timing, temporal-curve, and capacity paths before launching, while never reading or copying credential contents."
    - "If the replacement Windows child exits during that stability window, including during a prior-process lease handoff, startup control immediately requests another launch within the original bounded completion timeout. It never reports replacement success from a transient Task Scheduler Running observation or waits for the one-minute background restart policy."
    - "Task Scheduler may omit the task-level Enabled element when its value is the schema default true. Replacement accepts that exact form, preserves trigger enablement, explicitly disables the recreated task through Task Scheduler, and proves the resulting task is stopped before reporting replacement-ready."

local_ephemeral_release:
  scope: private_component_candidate_only
  rules:
    - "The explicitly dispatched Windows workflow accepts only the repository-scoped ephemeral runner selection and the exact self-hosted, Windows, X64, ephemeral, uci-suite, and lichess-release labels."
    - "The checked-in Installer-owned runner command validates the exact remote head, source and contract versions, workflow signing permissions, Visual Studio environment, Git Bash, and PowerShell module resolution before one dispatch. It never retries a component build automatically."
    - "A local physical runner is diagnostic private-candidate transport only. It is not stable suite publication or protected acceptance authority."

telemetry:
  runtime_schema: uci_arena_lichess_runtime_v3
  optional_graph_retention_diagnostics:
    fields:
      - mcgs_graph_node_capacity
      - mcgs_graph_edge_capacity
      - mcgs_graph_evictions
      - mcgs_graph_reclaimed_edges
      - mcgs_graph_reclaimed_spans
      - mcgs_graph_span_coalesces
      - mcgs_graph_capacity_deferrals
      - mcgs_graph_stale_handles
      - mcgs_graph_focus_admissions
      - mcgs_graph_focus_fallbacks
      - mcgs_explicit_reroots
    rules:
      - "These optional Engine-owned UCI info counters are admitted only as exact nonnegative JavaScript-safe integers. Missing or malformed optional diagnostics stay absent and do not change timing, legality, move selection, qualification, or search control."
      - "The existing bounded provider-owned move_played log preserves admitted counters with game_id and ply. The canonical game archive retains exact immutable Engine/runtime provenance; diagnostic collection joins those identities and must retain canary evidence before runtime-log rotation. This adds no search-evidence table, alternate game archive, or mandatory standard-UCI field."
  fields:
    - configured_and_qualified_capacity
    - active_pending_preparing_by_audience
    - scheduler_pause_and_reservation
    - discovery_and_challenge_timestamps
    - aggregate_and_per_opponent_wdl
    - adapter_and_engine_identity
    - api_cooldown_deadline_and_backoff_level
    - api_queue_depth_and_in_flight_request_class
    - api_429_counts_and_client_lease_health
    - challenge_create_quarantine_deadline_strikes_and_half_open_state
    - startup_phase_and_event_stream_lifecycle
  status_authority:
    - "A live PID is insufficient authority for active or ready. Runtime evidence must bind the exact current process instance, and evidence older than the bounded heartbeat window is stale even if that PID has been reused by another process."
    - "Status distinguishes missing, invalid, stale, inactive, stream-transport-disconnected, startup-waiting-for-global-cooldown, challenge-create-quarantined, scheduler-faulted, and ready states without reading a credential."
    - "The run process publishes a fresh process-bound starting heartbeat immediately after acquiring the API-client lease and before account probing or reconciliation can wait. Restored cooldown and challenge quarantine are emitted once to the bounded runtime log and projected in typed status."
    - "Potentially long exact engine, model, opening-book, tablebase, profile, or capacity validation keeps that lease and starting heartbeat fresh without weakening identity checks, reading credentials, contacting Lichess, or claiming readiness before validation completes."
    - "Status projects whether exactly one fresh local API-client lease belongs to the current provider process without returning its owner id, process identity, authority key, credential, or command line. A local lease cannot prove that no independently configured client exists on another host, so no cross-host exclusivity claim is made."

transport_bounds:
  rules:
    - "Every JSON or NDJSON response crossing the Lichess boundary has a byte bound before complete buffering or parsing. Long-lived streams are unbounded in duration but each record is bounded."
    - "Finite discovery results have an item bound consistent with the requested Lichess limit. Oversized bodies, records, and result sets fail closed with bounded errors."
    - "Successful empty-response operations cancel or boundedly drain unexpected response bodies; error-detail extraction never buffers an arbitrary response document."

validation:
  - "Config fixtures cover v2 compatibility, 1, default 1+1, 16-game layouts, invalid sums, and capacity-profile rejection."
  - "Deterministic scheduler tests prove owner priority, hard human capacity, zero overbooking, timeout/decline cooldowns, daily caps, and weighted selection."
  - "SQLite tests prove migration, WAL operation, idempotent challenge/game writes, reservations, restart recovery, and identity-separated WDL."
  - "Mock API tests prove discovery, serialized challenge operations, move priority, 429 backoff, cancellation-before-timeout-release, late-accept retention, active-game recovery borrowing, and event races."
  - "Loopback API-server integration proves real HTTP account probing, bearer rejection, BOT rejection, NDJSON discovery/stream parsing, challenge creation, and move submission without contacting Lichess."
  - "Concurrent engine tests require legal moves, isolated children, bounded startup, and graceful cleanup at every claimed capacity."
  - "Substitution tests run a minimal standard UCI fixture with no UCI Arena options or runtime_status and prove qualification, legal move submission, provenance, and one-slot admission."
  - "Race tests prove duplicate gameStart/reconciliation and outbound create-response reordering cannot create two children, two streams, a leaked slot, or a stale-generation release."
  - "Reconnect tests exceed the former retry threshold without ending the active session or releasing its authority."
  - "Startup reconciliation tests prove a transient API failure leaves the provider supervised, publishes a typed pending blocker, retries with bounded backoff, and reaches challenge-ready state after recovery."
  - "Startup recovery tests prove the Manager operation invokes only the existing registered task or unit and cannot mutate registration."
  - "Lease tests prove an exact live owner is retained, a reused live pid is reclaimed, and unverifiable identity fails closed."
  - "Transport tests reject oversized JSON, NDJSON records, and finite collections before unbounded buffering."
  - "Packaged Windows startup tests resolve the launcher at native/lichess_adapter_launcher.exe rather than a source-build directory."
  - "Windows lifecycle tests prove restart-disable precedes exact owned-tree termination, Task Scheduler stopped-state proof precedes Delete, deletion reaches absent state, and timeout or access failure cannot report uninstall success."

