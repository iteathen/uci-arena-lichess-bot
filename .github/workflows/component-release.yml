name: Lichess Bot component candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact component version
        type: string
        required: true
      target:
        description: Target platform
        type: choice
        required: true
        options:
          - windows-x86_64
          - linux-x86_64

permissions:
  contents: read
  id-token: write

concurrency:
  group: lichess-component-${{ inputs.version }}-${{ inputs.target }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-sign-verify:
    runs-on: ${{ inputs.target == 'windows-x86_64' && 'windows-2025' || 'ubuntu-24.04' }}
    env:
      RELEASE_WORKFLOW_IDENTITY: ${{ github.workflow_ref }}#${{ github.run_id }}.${{ github.run_attempt }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install exact Node dependency closure
        shell: pwsh
        run: npm ci --ignore-scripts

      - name: Build independent Windows windowless launchers
        if: inputs.target == 'windows-x86_64'
        shell: pwsh
        run: |
          foreach ($buildRoot in @('native/build', 'native/build-repro')) {
            cmake -S native -B $buildRoot -A x64
            if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed: $buildRoot" }
            cmake --build $buildRoot --config Release
            if ($LASTEXITCODE -ne 0) { throw "native launcher build failed: $buildRoot" }
            & "$buildRoot/Release/lichess_adapter_launcher.exe" --probe
            if ($LASTEXITCODE -ne 0) { throw "native launcher probe failed: $buildRoot" }
          }
          Copy-Item -LiteralPath native/build/Release/lichess_adapter_launcher.exe `
            -Destination native/lichess_adapter_launcher.exe

      - name: Test exact component source
        shell: pwsh
        run: |
          node tools/write-test-receipt.mjs `
            --output "release-receipts/${{ inputs.target }}.json" `
            --target "${{ inputs.target }}"

      - name: Write exact native toolchain receipt
        if: inputs.target == 'windows-x86_64'
        shell: pwsh
        run: |
          node tools/native-toolchain-receipt.mjs `
            --definition packaging/component-definition.json `
            --target "${{ inputs.target }}" `
            --workflow-identity $env:RELEASE_WORKFLOW_IDENTITY `
            --primary-build-root native/build `
            --reproduction-build-root native/build-repro `
            --output release-receipts/native-toolchain.json
          if ($LASTEXITCODE -ne 0) { throw 'native toolchain receipt construction failed' }

      - name: Build and compare independent component packages
        shell: pwsh
        run: |
          $epoch = git show -s --format=%ct HEAD
          $baseArguments = @(
            'tools/build-component-release.mjs',
            '--definition', 'packaging/component-definition.json',
            '--version', '${{ inputs.version }}',
            '--target', '${{ inputs.target }}',
            '--source-date-epoch', "$epoch",
            '--workflow-identity', $env:RELEASE_WORKFLOW_IDENTITY,
            '--test-receipt', 'release-receipts/${{ inputs.target }}.json'
          )
          if ('${{ inputs.target }}' -eq 'windows-x86_64') {
            $baseArguments += @(
              '--native-toolchain-receipt', 'release-receipts/native-toolchain.json'
            )
          }
          $primaryArguments = @($baseArguments + @('--output-dir', 'dist/provider'))
          $reproArguments = @($baseArguments + @('--output-dir', 'dist/provider-repro'))
          if ('${{ inputs.target }}' -eq 'windows-x86_64') {
            $primaryArguments += @(
              '--native-launcher', 'native/build/Release/lichess_adapter_launcher.exe'
            )
            $reproArguments += @(
              '--native-launcher', 'native/build-repro/Release/lichess_adapter_launcher.exe'
            )
          }
          & node @primaryArguments
          if ($LASTEXITCODE -ne 0) { throw 'Primary component construction failed' }
          & node @reproArguments
          if ($LASTEXITCODE -ne 0) { throw 'Reproduction component construction failed' }

          $primaryArchive = @(Get-ChildItem -LiteralPath dist/provider -File -Filter '*.tar.gz')
          $reproArchive = @(Get-ChildItem -LiteralPath dist/provider-repro -File -Filter '*.tar.gz')
          if ($primaryArchive.Count -ne 1 -or $reproArchive.Count -ne 1) {
            throw 'Reproducibility check requires exactly one archive per output root'
          }
          $primaryHash = (Get-FileHash -LiteralPath $primaryArchive[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $reproHash = (Get-FileHash -LiteralPath $reproArchive[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($primaryHash -ne $reproHash) {
            $diffRoot = Join-Path $env:RUNNER_TEMP 'lichess-provider-repro-diff'
            $diffA = Join-Path $diffRoot 'primary'
            $diffB = Join-Path $diffRoot 'reproduction'
            New-Item -ItemType Directory -Force $diffA, $diffB | Out-Null
            cmake -E chdir $diffA cmake -E tar xf $($primaryArchive[0].FullName)
            if ($LASTEXITCODE -ne 0) { throw 'Primary archive extraction failed during reproducibility diagnosis' }
            cmake -E chdir $diffB cmake -E tar xf $($reproArchive[0].FullName)
            if ($LASTEXITCODE -ne 0) { throw 'Reproduction archive extraction failed during reproducibility diagnosis' }
            $relativeFiles = @(
              Get-ChildItem -LiteralPath $diffA -File -Recurse |
                ForEach-Object { $_.FullName.Substring($diffA.Length + 1).Replace('\', '/') }
              Get-ChildItem -LiteralPath $diffB -File -Recurse |
                ForEach-Object { $_.FullName.Substring($diffB.Length + 1).Replace('\', '/') }
            ) | Sort-Object -Unique
            $firstDifference = '<archive metadata>'
            foreach ($relative in $relativeFiles) {
              $left = Join-Path $diffA $relative
              $right = Join-Path $diffB $relative
              if (-not (Test-Path -LiteralPath $left) -or -not (Test-Path -LiteralPath $right) -or
                  (Get-FileHash -LiteralPath $left -Algorithm SHA256).Hash -ne
                  (Get-FileHash -LiteralPath $right -Algorithm SHA256).Hash) {
                $firstDifference = $relative
                break
              }
            }
            throw "Independent component builds differ: primary=$primaryHash repro=$reproHash first_path=$firstDifference"
          }
          $primaryResult = @(Get-ChildItem -LiteralPath dist/provider -File -Filter '*.provider-result.json')
          $reproResult = @(Get-ChildItem -LiteralPath dist/provider-repro -File -Filter '*.provider-result.json')
          if ($primaryResult.Count -ne 1 -or $reproResult.Count -ne 1 -or
              (Get-FileHash -LiteralPath $primaryResult[0].FullName -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath $reproResult[0].FullName -Algorithm SHA256).Hash) {
            throw 'Independent component provider results differ'
          }
          Write-Output "Independent component reproducibility passed: $primaryHash"

      - name: Extract and verify component contract
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem dist/provider -Filter '*.tar.gz')
          $results = @(Get-ChildItem dist/provider -Filter '*.provider-result.json')
          if ($archives.Count -ne 1 -or $results.Count -ne 1) { throw 'expected one component artifact and one result' }
          $archive = $archives[0].FullName
          $result = $results[0].FullName
          New-Item -ItemType Directory -Path dist/provider/verification | Out-Null
          cmake -E chdir dist/provider/verification cmake -E tar xzf $archive
          if ($LASTEXITCODE -ne 0) { throw 'component extraction failed' }
          node tools/verify-component-release.mjs `
            --root dist/provider/verification `
            --artifact $archive `
            --result $result

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - name: Prepare exact in-toto statement
        id: attestation
        shell: pwsh
        env:
          STATEMENT_DIRECTORY: ${{ runner.temp }}/provider-attestation
        run: |
          node tools/provider-attestation.mjs prepare `
            --output-dir dist/provider `
            --statement-dir $env:STATEMENT_DIRECTORY `
            --github-output $env:GITHUB_OUTPUT

      - name: Sign and verify exact provenance
        shell: pwsh
        env:
          ARTIFACT_PATH: ${{ steps.attestation.outputs.artifact_path }}
          BUNDLE_PATH: ${{ steps.attestation.outputs.bundle_path }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
          PREDICATE_TYPE: ${{ steps.attestation.outputs.predicate_type }}
          STATEMENT_PATH: ${{ steps.attestation.outputs.statement_path }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_TRIGGER: ${{ github.event_name }}
        run: |
          cosign attest-blob --yes `
            --statement $env:STATEMENT_PATH `
            --bundle $env:BUNDLE_PATH
          if ($LASTEXITCODE -ne 0) { throw 'Sigstore attestation failed' }
          cosign verify-blob-attestation `
            --bundle $env:BUNDLE_PATH `
            --certificate-identity $env:CERTIFICATE_IDENTITY `
            --certificate-oidc-issuer $env:CERTIFICATE_OIDC_ISSUER `
            --certificate-github-workflow-repository $env:WORKFLOW_REPOSITORY `
            --certificate-github-workflow-sha $env:WORKFLOW_SHA `
            --certificate-github-workflow-name $env:WORKFLOW_NAME `
            --certificate-github-workflow-ref $env:WORKFLOW_REF `
            --certificate-github-workflow-trigger $env:WORKFLOW_TRIGGER `
            --type $env:PREDICATE_TYPE `
            $env:ARTIFACT_PATH
          if ($LASTEXITCODE -ne 0) { throw 'Sigstore verification failed' }
          node tools/provider-attestation.mjs verify-bundle `
            --bundle $env:BUNDLE_PATH `
            --statement $env:STATEMENT_PATH
      - name: Publish immutable private candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist/provider -File | Sort-Object Name)
          if ($assets.Count -ne 3) { throw "Expected exactly three candidate assets, found $($assets.Count)" }
          $tag = "component/lichess-bot/v$env:RELEASE_VERSION/$env:RELEASE_TARGET"
          $assetPaths = @($assets | ForEach-Object { $_.FullName })
          gh release create $tag @assetPaths `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --prerelease `
            --title "lichess-bot $env:RELEASE_VERSION $env:RELEASE_TARGET" `
            --notes "Immutable private component candidate; uci-arena-installer retains suite composition and promotion authority."
          if ($LASTEXITCODE -ne 0) { throw 'Private candidate publication failed' }
