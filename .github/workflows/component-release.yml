name: Diagnostic only - hosted provider startup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-startup:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
      - name: Install exact dependency closure
        shell: pwsh
        run: npm ci --ignore-scripts
      - name: Reproduce two startup failures with original operation bounds
        shell: pwsh
        run: |
          node --test --test-reporter=tap --test-timeout=60000 `
            --test-name-pattern='provider probe reaches the account API without a configured engine|supervised startup publishes restored cooldown before its account probe waits' `
            fake-api-server.test.mjs
          exit $LASTEXITCODE
