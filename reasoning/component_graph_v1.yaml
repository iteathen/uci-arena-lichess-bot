  targets: [G-T1, G-T3, G-T5, G-T6, G-T8, G-T9, G-T10, G-T14, G-T15]

local_objectives:
  - id: L-O1
    statement: >
      Extend UCI Arena's proving ground into uncontrolled competitive play against independently
      operated engines, including increasingly strong opposition.
    derived_from: [G-O1, G-M2]
    confidence: 0.999
  - id: L-O2
    statement: >
      Make external engine testing reliable and manageable without changing the selected
      engine's chess semantics.
    derived_from: [G-O2, G-T5]
    confidence: 0.99

premises:
  - id: L-P1
    statement: >
      Lichess stream state is authoritative for the remote game; local projections and UCI
      work must reconcile to it before submitting a move.
    confidence: 0.995
  - id: L-P2
    statement: >
      The selected UCI engine owns chess move choice and chess-thinking timing; the provider
      owns API transport, queueing, cooldown, remote-state validation, and acknowledgement.
    confidence: 0.995
  - id: L-P3
    statement: >
      Unknown opponents and configurations are a feature of external validation, not noise to
      be designed away, although they limit causal interpretation.
    confidence: 0.99
  - id: L-P4
    statement: >
      Network and API failures can mimic engine failure unless transport evidence is retained
      separately from engine evidence.
    confidence: 0.97
  - id: L-P5
    statement: >
      Credentials are operator-owned secrets and have no role in engine or evidence semantics.
    confidence: 0.999

  - id: L-P6
    statement: >
      The available Lichess opponent pool, ratings, engine versions, hardware, books, and
      configurations are not stationary or randomly sampled; scheduler choices therefore
      affect what external population the observed results describe.
    confidence: 0.99
  - id: L-P7
    statement: >
      Lichess rules, time controls, challenge state, rate limits, and API lifecycle are
      externally imposed parts of the proving environment and must be retained as evidence
      context rather than normalized into engine behavior.
    confidence: 0.995
  - id: L-P8
    statement: >
      Network, queue, request, and acknowledgement latency are stochastic provider-side costs
      that share the physical chess clock but are semantically distinct from engine thinking
      time.
    confidence: 0.995
  - id: L-P9
    statement: >
      Platform-specific chess rules that materially differ from a local/default rule context
      can change legal terminal outcomes and therefore must match the engine's admitted rule
      semantics for a valid external game.
    confidence: 0.999

premise_metadata:
  L-P1: {kind: structural}
  L-P2: {kind: structural}
  L-P3: {kind: structural}
  L-P4: {kind: material_risk}
  L-P5: {kind: structural}
  L-P6: {kind: empirical_regular}
  L-P7: {kind: structural}
  L-P8: {kind: empirical_regular}
  L-P9: {kind: structural}

implicit_assertions:
  - id: L-A1
    statement: >
      A Bot that silently modifies engine thinking time changes the engine under test and
      weakens the external-validation claim.
    derived_from: [L-P2, G-P10]
    confidence: 0.995
  - id: L-A2
    statement: >
      Fixed post-bestmove delay or repeatedly restarting an already-active API cooldown wastes
      clock without adding chess value or API compliance.
    derived_from: [L-P2, G-O1]
    confidence: 0.99
  - id: L-A3
    statement: >
      External wins are strongest validation when exact engine/runtime identity, opponent,
      control, and provider health are retained so transport accidents are not mistaken for
      chess strength.
    derived_from: [G-P3, G-P6, L-P4]
    confidence: 0.97
  - id: L-A4
    statement: >
      A final elite-engine benchmark requires repeated competitive evidence rather than a
      memorable isolated win.
    derived_from: [G-M2, G-T15]
    confidence: 0.97
  - id: L-A5
    statement: >
      Preserving a broad, engine-neutral standard-UCI path increases the external proving
      ground's usefulness beyond the suite's default engine.
    derived_from: [G-P5, L-O1]
    confidence: 0.95

  - id: L-A6
    statement: >
      Scheduler filters, rating targets, cooldowns, availability, and repeated-opponent limits
      shape the sampled external population, so observed win rate generalizes only to that
      admitted sampling process.
    derived_from: [L-P6, G-P24]
    confidence: 0.99
  - id: L-A7
    statement: >
      A Lichess rating or win-rate change across calendar time can reflect opponent-pool,
      platform, time-control, or configuration drift rather than an engine regression or gain.
    derived_from: [L-P6, L-P7, G-P16]
    confidence: 0.99
  - id: L-A8
    statement: >
      Playing many games against one narrow or repeatedly selected opponent class can improve
      precision without establishing broad external strength.
    derived_from: [L-P6, G-P24]
    confidence: 0.99
  - id: L-A9
    statement: >
      If the engine and Lichess disagree about automatic draw or other platform rule semantics,
      a legally transmitted move sequence can still yield invalid chess-strength evidence.
    derived_from: [L-P9, G-P17]
    confidence: 0.999
  - id: L-A10
    statement: >
      A conservative transport reserve can protect against flagging while still wasting chess
      opportunity if it materially exceeds the measured provider tail; transport safety and
      engine thinking allocation therefore require separate evidence.
    derived_from: [L-P8, L-P2]
    confidence: 0.98

  - id: L-A11
    statement: >
      Loopback API simulation can validate provider orchestration and transport contracts but
      cannot establish real Lichess availability, latency distribution, opponent population,
      or external playing strength.
    derived_from: [G-P28, L-P6, L-P8]
    confidence: 0.999

assertion_metadata:
  L-A1: {inference: structural, boundary: "Provider transport may constrain safe available clock and enforce remote rules; it must not invent chess-thinking strategy."}
  L-A2: {inference: structural, boundary: "Waiting is legitimate when required by real API, queue, legality, or remote-state constraints."}
  L-A3: {inference: conditional, boundary: "Exact provenance improves interpretation but does not make uncontrolled external results causal by itself."}
  L-A4: {inference: structural, boundary: "Repeated elite success remains scoped to the actual controls, opponents, platform, and time period represented."}
  L-A5: {inference: conditional, boundary: "Extended adapters may provide extra validation for engines that declare it while the neutral UCI path remains independently meaningful."}
  L-A6: {inference: structural, boundary: "Scheduler sampling can still be intentionally targeted; claims simply remain conditional on that sampling process."}
  L-A7: {inference: conditional, boundary: "Calendar comparisons can remain useful when drift is measured or explicitly part of the question."}
  L-A8: {inference: structural, boundary: "Narrow-opponent evidence remains valid for that opponent class."}
  L-A9: {inference: structural, boundary: "Platform-specific rule semantics may legitimately differ from local defaults; the requirement is agreement for the game being claimed."}
  L-A10: {inference: conditional, boundary: "A conservative bootstrap reserve can be justified before sufficient live transport evidence exists; it simply is not evidence of optimal utilization."}
  L-A11: {inference: structural, boundary: "Loopback/simulation remains strong evidence for provider logic and bounded protocol behavior it actually exercises."}

implementation_targets:
  - id: L-T1
    name: maintain_authoritative_remote_game_state
    statement: >
      Reconstruct and retain the exact current remote game state, clocks, rules, lifecycle,
      and terminal outcome needed for valid external competition.
    supports: [L-O1, G-T1]
  - id: L-T2
    name: submit_only_valid_current_moves
    statement: >
      Submit only a move that is legal and current for the authoritative remote game state and
      selected engine result.
    supports: [L-O1, G-T1]
  - id: L-T3
    name: preserve_engine_chess_timing_while_conveying_transport_constraints
    statement: >
      Supply authoritative clock/transport facts and unavoidable provider constraints without
      replacing the selected engine's chess-thinking policy.
    supports: [L-O1, G-T6]
  - id: L-T4
    name: obey_provider_timing_and_ordering_without_avoidable_clock_waste
    statement: >
      Respect actual API ordering, rate, queue, cooldown, and acknowledgement requirements
      while avoiding unnecessary delay beyond those requirements.
    supports: [L-O1, G-T8]
  - id: L-T5
    name: recover_external_games_without_losing_authority
    statement: >
      Survive stream, network, process, and restart failures without duplicating games,
      submitting stale moves, or fabricating remote completion.
    supports: [L-O1, L-O2, G-T8]
  - id: L-T6
    name: expose_engines_to_diverse_unknown_external_opposition
    statement: >
      Provide sustained competition against independently operated engines/configurations that
      broaden external validity beyond the Arena's self-selected local population.
    supports: [L-O1, G-T3]
  - id: L-T7
    name: enable_repeated_testing_against_elite_external_opposition
    statement: >
      Provide a credible operational path to repeated competitive evidence against very strong
      independently operated engines under retained exact conditions.
    supports: [L-O1, G-T15]
  - id: L-T8
    name: preserve_external_game_history_and_provenance
    statement: >
      Retain canonical external games and the identities/conditions needed to interpret them
      later without turning provider records into automatic causal or strength authority.
    supports: [G-T3, G-T4, G-T9]
  - id: L-T9
    name: preserve_operator_credential_authority
    statement: >
      Keep credentials operator-owned, secret, minimally exposed, and semantically separate
      from engine/evidence state.
    supports: [L-O2, G-T14]
  - id: L-T10
    name: support_conforming_engines_without_private_dependency
    statement: >
      Host conforming engine processes through public protocol/capability contracts without
      requiring private implementation knowledge of a particular engine.
    supports: [L-O1, G-T5]
  - id: L-T11
    name: make_external_competition_capacity_and_scheduling_manageable
    statement: >
      Give operators understandable control over capacity, opponents, scheduling, reservations,
      and externally consequential play while preserving provider safety constraints.
    supports: [L-O2, G-T7]
  - id: L-T12
    name: preserve_causal_separation_of_transport_and_engine_failures
    statement: >
      Distinguish provider/network/API failures from engine chess/runtime failures so external
      results can be interpreted and repaired at the correct owner.
    supports: [G-T4, G-T9]

