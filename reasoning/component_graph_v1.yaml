  - {id: L-T7, name: path_to_repeated_elite_external_opposition, supports: [L-O1, G-T15]}
  - {id: L-T8, name: canonical_external_game_archive_and_provenance, supports: [G-T3, G-T4, G-T9]}
  - {id: L-T9, name: secure_credential_boundary, supports: [L-O2, G-T14]}
